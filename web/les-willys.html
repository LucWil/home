    <div class="row"><input id="k72-n" placeholder="Ex. les packs d'eau sont en promo chez Aldi jusqu'à samedi" style="flex:3"><button class="btn accent" style="flex:none" id="k72-nok">Partager</button></div>
    <div style="display:grid;gap:8px;margin-top:10px">${notes.map(n=>`<div style="display:flex;gap:8px;align-items:flex-start">${mag(n.by,"sm")}<div style="min-width:0"><div>${esc(n.texte||"")}</div><span class="hint">${esc(M[n.by]?M[n.by].n:"")} · ${esc(fmtD(iso(new Date(n.at||Date.now())),{day:"numeric",month:"short"}))}</span></div></div>`).join("")||`<p class="hint" style="margin:0">Rien encore. Le premier conseil est pour toi.</p>`}</div></div>
  <p class="hint" style="margin-top:10px">D'après les conseils du Centre national de crise (campagne « Préparés ensemble ») et de la Commission européenne, qui demandent à chaque foyer de pouvoir tenir 72 heures. Cette liste est un point de départ, à adapter à votre famille.</p>`; }
plusRoute("kit72",renderKit72,"Kit 72 heures","regarde le kit 72 heures");
BIND_PLUS.push(root=>{
  const f=k72Foyer();
  root.querySelectorAll("[data-k72f]").forEach(b=>b.onclick=()=>{ S.k72F=b.dataset.k72f; render(); });
  const items=()=>JSON.parse(JSON.stringify(k72Doc(f).items||{}));
  root.querySelectorAll("[data-k72ok]").forEach(c=>c.onchange=()=>{ const it=items(), k=c.dataset.k72ok; it[k]={...(it[k]||{}),ok:c.checked}; k72Ecrire(f,{items:it}); });
  root.querySelectorAll("[data-k72q]").forEach(i=>i.onchange=()=>{ const it=items(), k=i.dataset.k72q; it[k]={...(it[k]||{}),qte:i.value.trim()}; if(i.value.trim()) it[k].ok=true; k72Ecrire(f,{items:it}); });
  root.querySelectorAll("[data-k72e]").forEach(i=>i.onchange=()=>{ const it=items(), k=i.dataset.k72e; it[k]={...(it[k]||{}),exp:i.value}; k72Ecrire(f,{items:it}); });
  root.querySelectorAll("[data-k72p]").forEach(i=>i.onchange=()=>{ const n=Math.max(1,Math.min(20,parseInt(i.value)||2)); k72Ecrire(f,{personnes:n}); });
  const bp=root.querySelector("#k72-plan"); if(bp) bp.onclick=async()=>{ const pl={}; root.querySelectorAll("[data-k72plan]").forEach(i=>pl[i.dataset.k72plan]=i.value.trim()); if(await k72Ecrire(f,{plan:pl})) toast("Plan enregistré"); };
  const bt=root.querySelector("#k72-test"); if(bt) bt.onclick=async()=>{ const te={date:root.querySelector("#k72-td").value,duree:root.querySelector("#k72-tl").value.trim(),bilan:root.querySelector("#k72-tb").value.trim()}; if(await k72Ecrire(f,{test:te})) toast("Essai noté"); };
  const bn=root.querySelector("#k72-nok"); if(bn) bn.onclick=async()=>{ const v=root.querySelector("#k72-n").value.trim(); if(!v) return; if(await save("kit72notes",{texte:v,foyer:f,by:S.me,at:Date.now()})) toast("Partagé avec la famille"); }; });
/* ---------- Rendu ---------- */
function bindCommon(root){
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const [k,arg]=b.dataset.add.split(":");
    (({event:()=>formEvent(),voyage:()=>formIdea("voyage"),weekend:()=>formIdea("weekend"),mot:formNote,recipe:()=>formRecipe(),
      stock:()=>formStock(arg),spice:()=>formStock("armoire",{cat:"epices"}),ticket:()=>formTicket(),bake:formBake,flour:formFlour,
      resto:formResto,garden:()=>formGarden(),harvest:formHarvest,work:formWork})[k]||(()=>{}))(); });
  root.querySelectorAll("[data-avis]").forEach(b=>b.onclick=()=>formAvis(b.dataset.avis));
  root.querySelectorAll("[data-vk]").forEach(b=>b.onclick=()=>{ location.hash=b.dataset.vk; });
  bindLoisirs(root);
  root.querySelectorAll("[data-restoedit]").forEach(b=>b.onclick=()=>{ const r=S.restos.find(x=>x.id===b.dataset.restoedit); if(r) formResto(r); });
  root.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>formPhoto(b.dataset.photo));
  root.querySelectorAll("[data-grand]").forEach(b=>b.onclick=()=>{ const ph=S.photos.find(x=>x.id===b.dataset.grand); if(ph) showShot(ph.url,ph.legend||""); });
  root.querySelectorAll("[data-vote]").forEach(b=>b.onclick=async()=>{
    const sem=lundiIso();
    if(await save("menuvotes",{semaine:sem,member:S.me,choix:+b.dataset.vote,at:Date.now()},sem+"__"+S.me)) toast("Voix enregistrée");
  });
  const wa2=root.querySelector("#wall-add"); if(wa2) wa2.onclick=formWall;
  const hp=root.querySelector("#hero-ph"); if(hp) hp.onclick=formWall;
  const vg=root.querySelector("#vote-go"); if(vg) vg.onclick=()=>voteCompose(vg);
  root.querySelectorAll("[data-photos]").forEach(b=>b.onclick=photoList);
  root.querySelectorAll("[data-evedit]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); evEdit(b.dataset.evedit); });
  root.querySelectorAll("[data-widget]").forEach(b=>b.onclick=copierWidget);
  root.querySelectorAll("[data-fjsaison]").forEach(b=>b.onclick=()=>saisonFrejus());
  if(root.querySelector&&root.querySelector("#fr-page")) frBind(root);
  root.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ const el=document.getElementById(b.dataset.goto); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); });
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [c,id]=b.dataset.del.split(":");
    if(b.dataset.sure){ remove(c,id); closeSheet(); }
    else { b.dataset.sure="1"; b.dataset.mot=b.textContent; b.textContent="Confirmer"; b.classList.add("sur");
      setTimeout(()=>{ if(b.isConnected&&b.dataset.sure){ delete b.dataset.sure; b.classList.remove("sur"); b.textContent=b.dataset.mot||"Retirer"; } },3500); } });
  root.querySelectorAll("[data-react]").forEach(b=>b.onclick=async()=>{ const [item,r]=b.dataset.react.split(":"); const id=item+"__"+S.me; const cur=S.reactions.find(x=>x.id===id);
    if(!S.db){ toast("Connecte-toi à claude.ai pour réagir."); return; }
    try{ if(cur&&cur.r===r) await S.db.collection("reactions").doc(id).delete(); else await S.db.collection("reactions").doc(id).set({item,member:S.me,r,at:Date.now()}); }catch{ toast("Réaction pas enregistrée."); } });
  root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));
  root.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>cookMode(b.dataset.tm));
  root.querySelectorAll("[data-recph]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); photoRecette(b.dataset.recph); });
  root.querySelectorAll("[data-cuisine]").forEach(b=>b.onclick=()=>{ const r=S.recipes.find(x=>x.id===b.dataset.cuisine); closeSheet(); if(r) czMarqueFait(r); if(r) askConsumed(r); });
  root.querySelectorAll("[data-etape]").forEach(b=>b.onclick=()=>etapeLyon(S.events.find(x=>x.id===b.dataset.etape)));
  root.querySelectorAll("[data-valise]").forEach(b=>b.onclick=()=>openValise(S.events.find(x=>x.id===b.dataset.valise)));
  try{ czBind(root); }catch(e){ console.error(e); }
  PLUS(BIND_PLUS,root);
  bindHome(root);
}
function oops(e,quoi){
  return `<div class="door" style="border-color:var(--warn)"><h3>${quoi} n'a pas pu s'afficher</h3>
  <p class="muted" style="margin:6px 0 0">Le reste de l'application fonctionne. Montre cette ligne \u00e0 Claude et il corrigera :</p>
  <p style="font-family:ui-monospace,monospace;font-size:12px;background:var(--soft);padding:10px;border-radius:8px;overflow-x:auto">${esc(String((e&&e.message)||e))}</p>
  <a class="btn accent" href="#accueil" style="text-decoration:none;display:inline-block">Revenir \u00e0 l'accueil</a></div>`;
}
function render(){
  try{ paintFaces(); }catch{}
  if(!S.me){ try{ renderPicker(); }catch(e){ app.innerHTML=oops(e,"L'\u00e9cran des pr\u00e9noms"); } return; }
  try{ fqAuto(); }catch(e){ console.error(e); }
  const r=route(); const tabs=document.getElementById("tabs"); tabs.hidden=false;
  const rTab=r==="weekends"?"voyages":r;
  tabs.querySelectorAll("a").forEach(a=>{ if(a.dataset.r===rTab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const me=M[S.me];
  const navMe=document.getElementById("nav-me");
  if(navMe){ navMe.innerHTML=mag(S.me); navMe.onclick=()=>{ S.me=null; store.set("frigo.me",""); render(); }; }
  const head=`<div class="top"><div><div class="eyebrow">${esc(fmtD(todayIso(),{weekday:"long",day:"numeric",month:"long"}))}</div><h1>${greet()} ${esc(me.n)}</h1></div>
  <div class="row" style="flex:none;gap:8px;align-items:center">${photoOf(S.me)
    ?`<button class="btn ghost" style="flex:none" data-photos="1">Les aimants</button>`
    :`<button class="btn ghost" style="flex:none" data-photo="${S.me}">Ajouter ma photo</button>`}
  <button class="me-chip" id="switch" title="Changer de prénom">${mag(S.me,"sm")}<span style="font-size:13px;font-weight:600">Pas ${esc(me.n)} ?</span></button></div></div>`;
  const banner = !S.db && S.ready ? `<div class="door" style="margin-bottom:16px;border-color:var(--warn)"><b>Les Willys sont en lecture seule ici.</b> <span class="muted">Ouvre ce lien connecté à ton compte claude.ai pour voir et ajouter les dates, idées et recettes de la famille.</span></div>` : "";
  let body;
  try{ body = {accueil:renderHome,calendrier:renderCal,voyages:()=>renderIdeas("voyage"),cuisine:renderCuisine,weekends:()=>renderIdeas("weekend"),loisirs:renderLoisirs,"chez-nous":renderNous,frejus:renderFrejus,...ROUTES_PLUS}[r](); }
  catch(e){ body = oops(e,"Cette page"); }
  const ici=r==="accueil"?"":`<div id="ici-aussi">${iciAussiHtml()}</div>`;
  const homeHead=`<div class="top w-top"><div style="min-width:0"><div class="w-hello">${greet()} ${esc(me.n)}</div><h1 class="w-title">Notre famille</h1></div>
  <div class="w-top-r"><button type="button" class="w-fam stack" data-photos="1" title="Les aimants de la famille" aria-label="Les aimants de la famille">${MEMBERS.map(m=>mag(m.k,"sm")).join("")}</button>
    <div class="w-top-links">${photoOf(S.me)?"":`<button type="button" class="w-switch" data-photo="${S.me}">Ajouter ma photo</button>`}<button type="button" class="w-switch" id="switch">Pas ${esc(me.n)} ?</button></div></div></div>`;
  const y=scrollY; app.innerHTML=r==="accueil"?`<div class="w-home">${homeHead}${banner}${body}</div>`:head+banner+ici+body; scrollTo(0,y);
  document.getElementById("switch").onclick=()=>{ S.me=null; store.set("frigo.me",""); render(); };
  app.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{ S.month=new Date(S.month.getFullYear(),S.month.getMonth()+ +b.dataset.mo,1); render(); });
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>formEvent(b.dataset.day));
  try{ app.querySelectorAll("canvas[data-art]").forEach(drawArt); }catch{}
  try{ bindCommon(app); }catch(e){ console.error(e); }
}
window.addEventListener("hashchange",()=>{ scrollTo(0,0); render(); signalerPresence(); });
window.addEventListener("error",ev=>{ try{
  if(app && !app.querySelector(".top, .person, .door")) app.innerHTML=oops(ev.error||ev.message,"L'application");
}catch{} });
S.sub=store.get("frigo.sub")||"stock";
const saved=store.get("frigo.me"); if(saved && M[saved] && !M[saved].kid && !M[saved].parti){ S.me=saved; S.lastSeen=+store.get("frigo.seen."+saved)||0; }
try{ render(); }catch(e){ app.innerHTML=oops(e,"L'application"); }
connect().then(()=>{ if(S.me) markVisit(); setTimeout(menageFil,8000); }).catch(e=>{ S.ready=true; try{ render(); }catch{} });
})();
</script>

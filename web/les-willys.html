<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Les Willys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Gochi+Hand&display=swap" media="print" onload="this.media='all'">
<style>
/* Concept : la porte du frigo familial. Fond émaillé, aimants de couleur par personne, petits mots manuscrits. */
:root{
  --bg:#e9efec; --door:#f6f9f7; --ink:#1d2734; --muted:#5d6b78; --line:#d3ddd8;
  --accent:#e2973a; --accent-ink:#5a3606; --soft:#dfe8e3;
  --ok:#2f8a5b; --warn:#c0582f;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Helvetica Neue", system-ui, sans-serif;
  --f-hand:"Gochi Hand", "Bradley Hand", "Comic Sans MS", cursive;
  --m-manhattan:#c8456b; --m-ambre:#d98a1f; --m-loulou:#8a5cc2; --m-chouchou:#2f6fb5;
  --m-julien:#2c9a8a; --m-robin:#5f8a2e; --m-leonor:#e07aa0; --m-amalia:#e5b437;
  --sc-be:#c0392b; --sc-lu:#93a3ad; --sc-fj:#2a7fa8;
  --shadow:0 1px 0 rgba(29,39,52,.06), 0 6px 18px -10px rgba(29,39,52,.35);
  --sky1:#2f6fb5; --sky2:#3f8fd0; --sky-soft:rgba(255,255,255,.16); --sky-title:#2f6fb5;
  --nav-bg:rgba(246,249,247,.86); --nav-shadow:0 16px 30px -14px rgba(29,39,52,.55);
  --tile-shadow:0 1px 0 rgba(29,39,52,.05),0 10px 22px -16px rgba(29,39,52,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a22; --door:#1a242e; --ink:#e8eef2; --muted:#9aa9b6; --line:#2b3946;
  --accent:#f0aa52; --accent-ink:#2a1a04; --soft:#222f3b; --ok:#5cc08b; --warn:#e88761;
  --sc-be:#e0705f; --sc-lu:#7b8a94; --sc-fj:#4b9ec4;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.8);
  --sky1:#1f4f86; --sky2:#2b6aa8; --sky-soft:rgba(255,255,255,.12); --sky-title:#7fb3ea;
  --nav-bg:rgba(26,36,46,.86); --nav-shadow:0 16px 30px -14px rgba(0,0,0,.8);
  --tile-shadow:0 1px 0 rgba(0,0,0,.3),0 10px 22px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a22; --door:#1a242e; --ink:#e8eef2; --muted:#9aa9b6; --line:#2b3946;
  --accent:#f0aa52; --accent-ink:#2a1a04; --soft:#222f3b; --ok:#5cc08b; --warn:#e88761;
  --sc-be:#e0705f; --sc-lu:#7b8a94; --sc-fj:#4b9ec4;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.8);
  --sky1:#1f4f86; --sky2:#2b6aa8; --sky-soft:rgba(255,255,255,.12); --sky-title:#7fb3ea;
  --nav-bg:rgba(26,36,46,.86); --nav-shadow:0 16px 30px -14px rgba(0,0,0,.8);
  --tile-shadow:0 1px 0 rgba(0,0,0,.3),0 10px 22px -14px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.hand{font-family:var(--f-hand);font-size:20px;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:inherit}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--door);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow)}
.magnet{--c:var(--muted);position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.18);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.magnet.sm{width:26px;height:26px;font-size:11px}
.magnet.lg{width:64px;height:64px;font-size:24px}
.stack{display:flex}
.magnet .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.wbars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:84px;margin:14px 0 6px}
.wbars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%}
.wbars i{display:block;border-radius:5px 5px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,var(--door)),color-mix(in srgb,var(--accent) 35%,var(--door)));min-height:3px}
.wbars span{font-size:11px;text-align:center;color:var(--muted);font-weight:600;text-transform:capitalize}
.stack .magnet{margin-left:-6px;border:2px solid var(--door)}
.stack .magnet:first-child{margin-left:0}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--door);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:620px;width:100%}
nav.tabs a{flex:1;text-decoration:none;text-align:center;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--soft)}

/* Blocs */
.door{background:var(--door);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
@media(min-width:760px){.grid.two{grid-template-columns:1.25fr 1fr}}
.section{display:grid;gap:14px;margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--door)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:16px 22px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:.5;cursor:default}
.wa{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:#1f8a4c;border:1px solid currentColor;border-radius:999px;padding:4px 10px}
:root[data-theme="dark"] .wa{color:#57d48c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{color:#57d48c}}

/* Post-it */
.note{position:relative;background:#fff6c9;color:#3b3110;border-radius:4px;padding:16px 16px 14px;transform:rotate(-1.2deg);box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.note:nth-child(even){transform:rotate(1deg);background:#ffe3d6}
.note .pin{position:absolute;top:-10px;left:50%;translate:-50% 0}
.note small{font-family:var(--f-body);font-size:12px;opacity:.75}
.notes{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));padding-top:8px}

/* Listes d'événements */
.ev{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.ev:first-child{border-top:0}
.date-tile{background:var(--soft);border-radius:12px;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
.date-tile b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.date-tile span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft)}
.tag.garde{background:color-mix(in srgb,var(--m-leonor) 22%,var(--door))}
.tag.voyage{background:color-mix(in srgb,var(--m-chouchou) 20%,var(--door))}
.tag.weekend{background:color-mix(in srgb,var(--m-robin) 22%,var(--door))}
.tag.ensemble{background:color-mix(in srgb,var(--accent) 28%,var(--door))}
.tag.frejus{background:color-mix(in srgb,var(--sc-fj) 26%,var(--door))}

/* Calendrier */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:74px;background:var(--door);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.day.out{opacity:.4}
.day.today{border:2px solid var(--accent)}
.wkband{grid-column:1 / -1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:7px 0 -2px}
.seg{font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.seg-be{border:1.5px solid var(--sc-be);color:var(--sc-be)}
.seg-lu{border:1px dashed var(--sc-lu);color:var(--sc-lu);font-weight:600}
.seg-fj{background:var(--sc-fj);color:#fff}
.legend-sc{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend-sc span{display:inline-flex;align-items:center;gap:7px}
.legend-sc i{width:28px;height:15px;border-radius:999px;display:block}
.legend-sc i.seg-be{border:1.5px solid var(--sc-be)}
.legend-sc i.seg-lu{border:1px dashed var(--sc-lu)}
.legend-sc i.seg-fj{background:var(--sc-fj)}
.sc-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px}
.sc-chip i{width:16px;height:16px;border-radius:50%;flex:none}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;margin-top:12px}
.polar{background:#fff;padding:10px 10px 0;border-radius:3px;box-shadow:0 12px 22px -14px rgba(29,39,52,.7);display:flex;flex-direction:column;gap:8px}
.polar:nth-child(3n+1){transform:rotate(-1.6deg)}
.polar:nth-child(3n+2){transform:rotate(1.4deg)}
.polar img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee;cursor:zoom-in}
.polar .cap{font-family:var(--f-hand);font-size:19px;color:#3b3110;line-height:1.15;padding:2px 2px 0}
.polar .bas{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 10px}
.polar .pin{position:absolute;top:-9px;left:50%;translate:-50% 0}
.vote-opt{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--door)}
.vote-opt.gagne{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--door))}
.spices{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:8px}
.spice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  border:1px solid var(--line);border-left:4px solid var(--c,var(--muted));background:var(--door);border-radius:11px;padding:10px 12px}
.spice b{font-size:14.5px;line-height:1.25}
.spice:hover{border-color:var(--ink);border-left-color:var(--c,var(--muted))}
.react.sur{background:var(--warn);color:#fff;border-color:var(--warn)}
.sc-chip i.be{border:2px solid var(--sc-be)}
.sc-chip i.lu{border:1.5px dashed var(--sc-lu)}
.day .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.day .bar{font-size:10.5px;line-height:1.25;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--c,var(--muted))}
@media(max-width:520px){.day{min-height:54px}.day .bar{font-size:0;height:6px;padding:0}}

/* Cartes idées */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.idea{display:flex;flex-direction:column;gap:10px;background:var(--door);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.idea .cover{aspect-ratio:16/9;max-width:100%;background:var(--soft) center/cover no-repeat;position:relative}
.idea .cover .price{position:absolute;right:10px;bottom:10px;background:var(--door);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.idea .body{padding:0 16px 16px;display:grid;gap:8px;min-width:0}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.react.on{background:var(--ink);color:var(--door);border-color:var(--ink)}
.who{font-size:13px;color:var(--muted)}

/* Cuisine */
.cz-promo{margin-top:14px;border:2px solid var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,var(--door)),var(--door) 72%);box-shadow:0 14px 30px -18px color-mix(in srgb,var(--accent) 85%,transparent)}
.cz-promo-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cz-promo-h h2{font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.czp-g{margin-top:16px}
.czp-aussi{margin-top:6px;font-size:13.5px;line-height:1.35;border-radius:10px;padding:6px 10px;background:color-mix(in srgb,var(--sky1) 12%,var(--door))}
.czp-add{border:2px solid var(--ok);background:var(--door);color:var(--ok);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;margin-top:4px;min-height:38px}
.czp-add.on{background:var(--ok);color:#fff}
.pj-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pj-tools input{flex:1;min-width:180px}
.pj-seg button{font-size:14px}
.item.pj-avec-pate{grid-template-columns:auto minmax(0,1fr) auto}
.pj-pcol{display:grid;justify-items:center;gap:4px;align-self:start}
.pj-poids{border:0;border-radius:999px;padding:2px 9px;background:#b07a0c;color:#fff;font-family:var(--f-display);font-weight:800;font-size:14px;white-space:nowrap;line-height:1.3}
.pj-poids.vide{background:transparent;color:#b07a0c;border:1.5px dashed #e9c46a;font-size:12px;font-family:var(--f-body)}
.pj-tot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0 2px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,#e9c46a 22%,var(--door))}
.pj-tot i{font-style:normal;color:var(--muted);font-size:12.5px}
.pj-pate{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#b07a0c;background:#fbeec4;border:1.5px solid #e9c46a;flex:none}
:root[data-theme="dark"] .pj-pate{color:#f2c45a;background:#3a3020;border-color:#7a6230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pj-pate{color:#f2c45a;background:#3a3020;border-color:#7a6230}}
.pj-ptype{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#b07a0c}
:root[data-theme="dark"] .pj-ptype{color:#f2c45a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pj-ptype{color:#f2c45a}}
@media(max-width:470px){.item.pj-avec-pate{grid-template-columns:auto minmax(0,1fr)}.item.pj-avec-pate > .row{grid-column:1 / -1}}
.pj-ouv{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;background:color-mix(in srgb,var(--accent) 22%,var(--door))}
.pj-ouv.urg{background:var(--warn);color:#fff}
.react.pj-on{background:color-mix(in srgb,var(--accent) 28%,var(--door));border-color:var(--accent);font-weight:700}
.pj-idees{margin-top:18px;display:grid;gap:10px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,var(--door));border:1px solid var(--line)}
.pj-idees .czp-gt{margin-bottom:0}
.pj-idee{background:var(--door);border:1px solid var(--line);border-radius:12px;padding:12px}
.pj-idee b{font-family:var(--f-display);font-size:17px}
.czp-seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.czp-seg button{border:2px solid var(--mc);background:var(--door);color:var(--mc);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;line-height:1.2;min-height:40px}
.czp-seg button small{font-size:12px;opacity:.75;font-weight:700}
.czp-seg button[aria-pressed="true"]{background:var(--mc);color:#fff}.czp-gt{font-size:clamp(21px,5vw,26px);font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:12px;border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,var(--line));padding-bottom:8px;margin-bottom:2px}
.czp-ico{font-size:34px;line-height:1;width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 20%,var(--door))}
.czp-rem{display:grid;justify-items:end;gap:2px}
.czp-rem b{background:var(--ok);color:#fff;border-radius:10px;padding:2px 10px;font-size:20px;font-family:var(--f-display);font-weight:800;white-space:nowrap}
.czp-rem i{font-style:normal;font-size:12.5px;font-weight:800;color:var(--ok);white-space:nowrap}
.czp-gain{font-size:12.5px;font-weight:700;color:var(--ok);white-space:nowrap}
.czp-it{align-items:start}
.czp-mag{display:inline-flex;align-items:center;gap:9px;margin:2px 0 6px;padding:4px 16px 4px 4px;border-radius:12px;background:var(--mc);color:#fff;font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;box-shadow:0 4px 10px -6px rgba(0,0,0,.5)}
.czp-mag i{font-style:normal;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--mc);font-size:19px}
.czp-prod{font-size:16.5px;line-height:1.3}
.czp-it > div:first-child{display:flex;flex-direction:column;align-items:flex-start}
.czp-fin{display:inline-block;margin-top:5px;font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--soft)}
.czp-fin.czp-urg{background:var(--warn);color:#fff}
.czp-it .meta{margin-top:4px}
.czp-px{display:grid;justify-items:end;gap:3px;text-align:right}
.czp-px b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.czp-px s{font-size:13px;color:var(--muted)}
.czp-px .react{margin-top:4px;font-size:13px}
.cz-promo-k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:color-mix(in srgb,var(--accent) 70%,var(--ink));margin-bottom:2px}
.season{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,var(--door)),var(--door));border-radius:18px;padding:16px 18px;display:grid;gap:8px;border:1px solid var(--line)}
.season ul{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.season li{background:var(--door);border-radius:999px;padding:3px 11px;font-weight:600;font-size:14px}
.cost{letter-spacing:.05em;font-weight:800;color:var(--accent)}
.cost i{font-style:normal;color:var(--line)}
.recipe-cover{aspect-ratio:4/3;max-width:100%;border-radius:14px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.recipe-cover canvas{width:100%;height:100%}
.recipe-cover{position:relative}
.sheet .recipe-cover{aspect-ratio:auto;height:min(62vw,320px);flex:none}
.recipe-cover .ph-btn{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:0;
  background:rgba(20,25,31,.72);color:#fff;font-weight:700;font-size:14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.photo-choix{display:flex;gap:12px;align-items:center}
.photo-choix img{width:96px;height:72px;object-fit:cover;border-radius:10px;display:block}

/* Mode Thermomix */
.tm{position:fixed;inset:0;z-index:50;background:#14191f;color:#f2f5f7;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.tm .tm-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tm .tm-step{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:760px;width:100%;margin:0 auto}
.tm .tm-text{font-size:clamp(22px,4.5vw,34px);line-height:1.3;font-weight:600}
.tm .dials{display:flex;gap:12px;flex-wrap:wrap}
.tm .dial{flex:1;min-width:96px;background:#222b34;border-radius:16px;padding:12px 14px;text-align:center}
.tm .dial b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;color:#4fd1a1}
.tm .dial span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#9fb0bd}
.tm .tm-nav{display:flex;gap:12px}
.tm .tm-nav button{flex:1;border:0;border-radius:18px;padding:22px;font-size:20px;font-weight:700}
.tm .prev{background:#2b3540;color:#f2f5f7}
.tm .next{background:#4fd1a1;color:#08251a}
.tm .progress{height:6px;background:#2b3540;border-radius:3px;overflow:hidden}
.tm .progress i{display:block;height:100%;background:#4fd1a1}
.tm .close{background:#2b3540;border:0;color:#f2f5f7;border-radius:12px;padding:8px 14px;font-weight:700}

/* Feuilles (formulaires) */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--door);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:2px solid transparent;background:transparent;border-radius:999px;padding:2px}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);font-weight:400}

/* Accueil membres */
.family{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.person{border:1px solid var(--line);background:var(--door);border-radius:18px;padding:16px 10px;display:grid;justify-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.person:hover{border-color:var(--ink)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--door);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
.shop li{list-style:none;display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.shop{padding:0;margin:0}
.shop input{width:auto}
/* Espace privé du foyer */
.seg{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--soft);border-radius:14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--door);color:var(--ink);box-shadow:var(--shadow)}
.lock{max-width:380px;margin:0 auto;display:grid;gap:14px;justify-items:center;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:290px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:16px 0;font-family:var(--f-display);font-size:22px;font-weight:700}
.pad button.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dots{display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
/* Surgélateur dessiné tiroir par tiroir */
.freezer{display:grid;gap:8px;background:linear-gradient(180deg,#cfe0e8,#aec6d4);padding:10px;border-radius:18px;border:1px solid var(--line)}
:root[data-theme="dark"] .freezer{background:linear-gradient(180deg,#26353f,#1a242c)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .freezer{background:linear-gradient(180deg,#26353f,#1a242c)}}
.drawer{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--door);border:1px solid var(--line);border-left:7px solid var(--c,var(--muted));border-radius:10px;padding:14px}
.drawer .handle{position:absolute;left:50%;translate:-50% 0;top:5px;width:34%;height:4px;border-radius:2px;background:var(--line)}
.drawer b{font-family:var(--f-display);font-size:16px}
.drawer.hit{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--door));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.items{display:grid;gap:2px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px dashed var(--line);padding:9px 0;min-width:0}
.item:first-child{border-top:0}
.item .meta{font-size:13px;color:var(--muted)}
.item.warn .meta{color:var(--warn);font-weight:600}
.bar-life{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px;max-width:240px}
.bar-life i{display:block;height:100%;background:var(--ok)}
.bar-life.warn i{background:var(--warn)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--door);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.05}
.stat span{font-size:13px;color:var(--muted)}
.boni{background:linear-gradient(130deg,color-mix(in srgb,var(--ok) 28%,var(--door)),var(--door));border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:10px}
.boni .big{font-family:var(--f-display);font-size:clamp(36px,9vw,56px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.scan{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;display:grid;gap:10px;justify-items:center}
.scan input[type=file]{display:none}
.scan label.btn{cursor:pointer}
.tick{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.rev{display:grid;grid-template-columns:auto 1fr 76px;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.rev input[type=checkbox]{width:auto}
.rev.wide{grid-template-columns:auto 1fr 118px}
.revh{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.revh input[type=checkbox]{width:auto;margin-top:10px}
.revh label{gap:2px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--soft);cursor:zoom-in}
.shot-prev{width:100%;max-width:280px;border-radius:14px;display:block;margin:0 auto}
@media(max-width:430px){nav.tabs a{font-size:10.5px}.seg button{padding:8px 11px;font-size:13px}}
@media(max-width:470px){.item:has(> .row){grid-template-columns:1fr;gap:6px}.item > .row{justify-content:flex-end}
  .section-head .btn{flex:none}.stat b{font-size:22px}}
/* La maison dessinée, sur l'écran des prénoms */
.fridge.house{border-radius:10px 10px 18px 18px;margin-top:84px;padding:14px;background:linear-gradient(180deg,#e9d8c4,#dcc6ad);box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 30px 46px -30px rgba(29,39,52,.65)}
.house .roof{position:absolute;left:-8px;right:-8px;top:-70px;height:72px;background:linear-gradient(180deg,#b5553c,#953f2c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house .chimney{position:absolute;right:22%;top:6px;width:26px;height:44px;background:#7f3626;clip-path:none}
.house .roof::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:rgba(0,0,0,.15)}
.house .panel{background:linear-gradient(158deg,#fffdf8,#f6efe4 62%,#efe5d6)}
.house .win,.house .frontdoor{position:absolute;border-radius:8px 8px 3px 3px}
.house .win{display:none}
.house .frontdoor{right:10px;bottom:0;width:30px;height:62px;background:linear-gradient(180deg,#2f6fb5,#24589a);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.house .frontdoor::after{content:"";position:absolute;right:6px;top:30px;width:5px;height:5px;border-radius:50%;background:#e5b437}
.house .lawn{position:absolute;left:-8px;right:-8px;bottom:-12px;height:14px;border-radius:0 0 14px 14px;background:linear-gradient(180deg,#7fae5a,#5f8a2e)}
:root[data-theme="dark"] .fridge.house{background:linear-gradient(180deg,#4a3f35,#3b322a)}
:root[data-theme="dark"] .house .panel{background:linear-gradient(158deg,#3a4852,#2c3842 62%,#27323a)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fridge.house{background:linear-gradient(180deg,#4a3f35,#3b322a)}
  :root:not([data-theme="light"]) .house .panel{background:linear-gradient(158deg,#3a4852,#2c3842 62%,#27323a)}}
/* La bannière d'accueil */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px;border-radius:22px;margin-bottom:18px;
  background:linear-gradient(130deg,color-mix(in srgb,var(--accent) 26%,var(--door)),color-mix(in srgb,var(--m-loulou) 14%,var(--door)) 70%);
  box-shadow:0 18px 34px -26px rgba(29,39,52,.6)}
.hero .ph{width:132px;height:132px;border-radius:18px;object-fit:cover;transform:rotate(-3deg);box-shadow:0 10px 18px -10px rgba(0,0,0,.6);border:5px solid #fff}
.hero h2{font-size:clamp(24px,5vw,32px);margin:2px 0 6px;line-height:1.1}
.hero .fam{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
@media(max-width:520px){.hero{grid-template-columns:1fr}.hero .ph{width:100%;height:150px;transform:none}}
/* Le frigo dessiné, sur l'écran des prénoms */
.fridge{position:relative;max-width:420px;margin:22px auto 26px;padding:14px;border-radius:26px;
  background:linear-gradient(100deg,#b9c7c4,#d2dcd9 18%,#c4d0cd 60%,#aab8b5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75), inset 0 -2px 6px rgba(29,39,52,.18), 0 30px 46px -30px rgba(29,39,52,.65)}
.fridge .panel{position:relative;border-radius:16px;background:linear-gradient(158deg,#fdfefe,#eef4f2 62%,#e2ebe8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(29,39,52,.22)}
.fridge .freezer{height:106px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 40px 0 16px}
.fridge .door{min-height:246px;padding:26px 40px 28px 16px}
.fridge .grip{position:absolute;right:11px;top:16px;bottom:16px;width:10px;border-radius:6px;
  background:linear-gradient(90deg,#8d9d9a,#cdd8d5 38%,#7f8f8c);box-shadow:0 2px 4px rgba(29,39,52,.45)}
.fridge .feet{position:absolute;left:34px;right:34px;bottom:-9px;display:flex;justify-content:space-between}
.fridge .feet i{display:block;width:40px;height:10px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#8ea09c,#6d7d7a)}
.fridge .tag-date{background:#fff6c9;color:#3b3110;border-radius:3px;padding:9px 13px;transform:rotate(-3.5deg);
  box-shadow:0 9px 15px -10px rgba(0,0,0,.6);font-family:var(--f-hand);font-size:17px;line-height:1.15;text-align:center;max-width:140px}
.people{display:flex;flex-wrap:wrap;gap:22px 14px;justify-content:center}
.pm{background:none;border:0;padding:2px;display:grid;justify-items:center;gap:7px;width:90px;transition:transform .15s ease}
.pm .magnet{box-shadow:inset 0 -4px 0 rgba(0,0,0,.22), 0 5px 8px rgba(29,39,52,.35)}
.pm b{font-family:var(--f-display);font-size:15px;letter-spacing:-.01em}
.pm:nth-child(3n+1){transform:rotate(-6deg)}
.pm:nth-child(3n+2){transform:rotate(4deg)}
.pm:nth-child(3n){transform:rotate(-2deg)}
.pm:hover,.pm:focus-visible{transform:rotate(0deg) scale(1.07)}
.kidmag{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 13px 5px 5px;
  box-shadow:0 4px 9px -4px rgba(29,39,52,.6);transform:rotate(2.5deg)}
.kidmag:last-child{transform:rotate(-3.5deg)}
.kidmag b{font-size:14px}
:root[data-theme="dark"] .fridge{background:linear-gradient(100deg,#2b363d,#3b4951 18%,#303c44 60%,#232e35)}
:root[data-theme="dark"] .fridge .panel{background:linear-gradient(158deg,#3a4852,#2c3842 62%,#27323a);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.5)}
:root[data-theme="dark"] .fridge .grip{background:linear-gradient(90deg,#4a585f,#78888f 38%,#404d54)}
:root[data-theme="dark"] .fridge .feet i{background:linear-gradient(180deg,#3d4a51,#2a343a)}
:root[data-theme="dark"] .kidmag{background:#3f4d57}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fridge{background:linear-gradient(100deg,#2b363d,#3b4951 18%,#303c44 60%,#232e35)}
  :root:not([data-theme="light"]) .fridge .panel{background:linear-gradient(158deg,#3a4852,#2c3842 62%,#27323a);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .fridge .grip{background:linear-gradient(90deg,#4a585f,#78888f 38%,#404d54)}
  :root:not([data-theme="light"]) .fridge .feet i{background:linear-gradient(180deg,#3d4a51,#2a343a)}
  :root:not([data-theme="light"]) .kidmag{background:#3f4d57}}
@media(max-width:400px){.fridge .door{padding:22px 36px 24px 12px}.pm{width:82px}.people{gap:18px 8px}}
/* Grands écrans : on occupe la place, en colonnes plutôt qu'en lignes étirées */
@media(min-width:1100px){
  .wrap{max-width:1400px}
  nav.tabs .in{max-width:860px}
  .cal .day{min-height:104px}
  .fridge{max-width:520px}
  .grid.two{grid-template-columns:1.35fr 1fr}
  .section.cols{grid-template-columns:1fr 1fr;align-items:start}
  .section.cols > .full,.section.cols > .stats,.section.cols > .section-head{grid-column:1 / -1}
  .freezer{align-self:start}
  .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .notes{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media(min-width:1500px){.wrap{max-width:1540px}}
/* La vie de la maison : fil d'activité, présence en direct, bannière */
.vert{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--door);animation:respire 1.4s ease-in-out infinite alternate}
@keyframes respire{from{transform:scale(.9)}to{transform:scale(1.12)}}
.pres{position:relative;display:inline-flex}
.ici-aussi{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:color-mix(in srgb,var(--ok) 15%,var(--door));font-size:13.5px;font-weight:600;margin:0 0 14px}
.fil{display:grid}
.fil a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line);text-decoration:none}
.fil a:first-child{border-top:0}
.fil .quand{font-size:12.5px;color:var(--muted)}
.fil .ong{font-size:12px;font-weight:700;color:var(--accent);padding-top:3px;white-space:nowrap}
.banniere{position:fixed;z-index:70;left:50%;top:calc(10px + env(safe-area-inset-top,0px));translate:-50% -140%;width:min(560px,calc(100% - 24px));
  display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border:0;border-radius:999px;text-align:left;
  background:color-mix(in srgb,var(--door) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 28px -10px rgba(0,0,0,.35);color:var(--ink);font-weight:600;font-size:15px;line-height:1.25;transition:translate .35s cubic-bezier(.2,.9,.3,1.2)}
.banniere.on{translate:-50% 0}
.fiche-resto{display:grid;gap:6px;font-size:14px}
.fiche-resto .ligne{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.fiche-resto .ligne svg{flex:none;margin-top:2px;color:var(--muted)}
.fiche-resto a{color:inherit;text-decoration-color:var(--line)}
.actions-resto{display:flex;flex-wrap:wrap;gap:8px}
.actions-resto a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);background:var(--door)}
.actions-resto a.prim{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu-resto{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.menu-resto summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.menu-resto summary::-webkit-details-marker{display:none}
.plat{display:flex;gap:8px;align-items:baseline;font-size:14px}
.plat .pts{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px)}
.plat b{font-variant-numeric:tabular-nums;white-space:nowrap}
.avis-clients{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px}
.item.neuf{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px;padding-inline:8px}
/* Nouveau look : l'accueil en tuiles et la barre d'onglets flottante (préfixe w-) */
nav.tabs{left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(460px,calc(100% - 28px));
  padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--nav-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--nav-shadow);display:flex;align-items:center;gap:2px}
nav.tabs .in{display:flex;gap:2px;flex:1;min-width:0;max-width:none;width:auto}
nav.tabs a{position:relative;flex:1;min-width:0;height:46px;padding:0;border-radius:999px;display:grid;place-items:center;gap:0;color:var(--muted);font-size:12px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{background:var(--sky1);color:#fff}
.w-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.w-navme{flex:none;width:46px;height:46px;border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center}
.w-navme .magnet{width:34px;height:34px;font-size:14px}
.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}

.w-home{display:grid;gap:18px;max-width:1040px;margin:0 auto;min-width:0}
.w-home > .section{margin-top:6px}
.w-top{margin:0;align-items:center;gap:12px}
.w-hello{font-size:14px;font-weight:600;color:var(--muted)}
.w-title{font-size:clamp(28px,5vw,38px);color:var(--sky-title)}
.w-top-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto}
.w-fam{border:0;background:none;padding:2px;border-radius:999px;cursor:pointer}
.w-fam .magnet{margin-left:-8px;border:2px solid var(--bg)}
.w-fam .magnet:first-child{margin-left:0}
.w-top-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.w-switch{border:0;background:none;padding:2px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.w-switch:hover{color:var(--ink)}

/* Bandeau « Aujourd'hui » */
.w-today{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;
  background:linear-gradient(140deg,var(--sky1),var(--sky2));box-shadow:0 18px 34px -24px rgba(31,79,134,.9);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.w-today h2{font-size:24px;font-weight:700;color:#fff}
.w-kick{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.8;margin-bottom:2px}
.w-evs{display:grid;gap:10px;margin-top:12px}
.w-ev{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;color:#fff;text-decoration:none}
.w-ev i{border-radius:3px;background:var(--c,#fff);box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.w-ev b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.w-ev span{display:block;font-size:13px;opacity:.85}
.w-ev.w-be i{background:var(--sc-be)}
.w-ev.w-lu i{background:transparent;box-shadow:none;border-left:2px dashed rgba(255,255,255,.8)}
.w-calm{margin:12px 0 0;font-size:15px;line-height:1.4;opacity:.95}
.w-page{width:76px;border-radius:14px;background:#fff;color:#1d2734;text-align:center;overflow:hidden;
  box-shadow:0 10px 18px -10px rgba(0,0,0,.5);transform:rotate(4deg);margin-top:4px}
.w-page em{display:block;font-style:normal;background:var(--m-manhattan);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.w-page b{display:block;font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.1;padding:2px 0 6px;font-variant-numeric:tabular-nums}
.w-mot{grid-column:1 / -1;display:flex;align-items:center;gap:10px;background:var(--sky-soft);border-radius:14px;padding:8px 12px;font-family:var(--f-hand);font-size:19px;line-height:1.2;min-width:0}
.w-mot span:last-child{min-width:0;overflow-wrap:anywhere}
.w-acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.w-bt{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;line-height:1.2}
.w-bt:hover{background:rgba(255,255,255,.26)}
.w-bt.w-prim{background:#fff;color:#1f4f86;border-color:#fff}
.w-today :focus-visible{outline-color:#fff}

/* Tuiles */
.w-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w-tile{--c:var(--muted);position:relative;background:var(--door);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--tile-shadow);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px;min-height:104px;min-width:0;width:100%;
  color:var(--ink);text-decoration:none;text-align:left;font:inherit;transition:transform .15s ease,border-color .15s ease}
a.w-tile:hover,button.w-tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.w-tile > h3{font-size:17px;font-weight:700;grid-column:1 / -1;align-self:start;padding-right:34px}
.w-tile > p{margin:0;font-size:13px;color:var(--muted);line-height:1.3;min-width:0;overflow-wrap:anywhere}
.w-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);overflow:hidden;
  background:color-mix(in srgb,var(--c) 14%,var(--door));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.w-ico svg{width:22px;height:22px}
.w-ico img{width:100%;height:100%;object-fit:cover;display:block}
.w-badge{position:absolute;top:12px;right:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 8px}
.w-wide{grid-column:1 / -1;grid-template-columns:minmax(0,1fr);align-items:start;gap:8px;min-height:0}
.w-wide > h3{padding-right:0}
.w-pres{border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.w-pres h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--f-body)}
@media(min-width:760px){
  .w-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .w-today{padding:24px}
  .w-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);column-gap:24px}
  .w-wide > h3{grid-column:1 / -1}
  .w-pres{border-top:0;padding-top:0;border-left:1px dashed var(--line);padding-left:20px}
}
/* La une de l'accueil : le marché du jour, « À découvrir » (préfixe ag-) */
.ag-une{border-radius:24px;padding:14px 18px;background:linear-gradient(135deg,#2c9a8a,#1f7a6c);color:#fff;display:grid;gap:10px;box-shadow:0 18px 34px -24px rgba(31,122,108,.9);margin-bottom:0}
.ag-une.ag-une-pt{background:linear-gradient(135deg,color-mix(in srgb,#2c9a8a 55%,var(--door)),color-mix(in srgb,#2c9a8a 35%,var(--door)));color:var(--ink)}
.ag-une-k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;opacity:.85}
.ag-une-l{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;color:inherit;text-decoration:none}
.ag-une-ico{font-size:34px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.ag-une-l b{display:block;font-family:var(--f-display);font-size:clamp(22px,6vw,30px);line-height:1.1;letter-spacing:-.01em}
.ag-une-h{display:block;font-size:19px;font-weight:700;margin-top:2px}
.ag-une-p{display:block;font-size:14px;opacity:.9;text-decoration:underline;text-underline-offset:2px}
.ag-decs-w{margin-bottom:0;min-width:0;max-width:100%}
.ag-decs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.ag-decs::-webkit-scrollbar{display:none}
.ag-dec{flex:0 0 auto;width:min(62vw,220px);scroll-snap-align:start;display:grid;gap:3px;align-content:start;padding:12px;border-radius:18px;background:var(--door);border:1px solid var(--line);box-shadow:var(--tile-shadow);color:var(--ink);text-decoration:none;font-size:13px}
.ag-dec b{font-size:15.5px;line-height:1.25}
.ag-dec span{color:var(--muted)}
.ag-dec .ag-dec-k{justify-self:start;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#1f7a6c;background:color-mix(in srgb,#2c9a8a 16%,var(--door));border-radius:999px;padding:1px 8px}
.ag-dec .ag-dec-i{font-size:26px;color:inherit}
.vv-c{font:inherit;text-align:left;cursor:pointer}
.vv-ph{width:100%;height:96px;object-fit:cover;border-radius:12px;display:block;margin-bottom:4px}
.vv-px b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.ag-dec .ag-dec-k.vv-baisse{color:#fff;background:var(--ok)}
.ag-dec .ag-dec-k.vv-bas{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--door))}
.ag-dec .ag-dec-k.vv-pep{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 30%,var(--door))}
.ag-dec .ag-dec-k.vv-neige{color:var(--sky-title);background:color-mix(in srgb,var(--sky1) 14%,var(--door))}
.ag-dec-bp .ag-dec-k{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 30%,var(--door))}
/* La saison à Fréjus (préfixe fs-) */
.fs-mois-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fs-mois{display:grid;gap:6px;align-content:start;min-width:0}
.fs-mn{font-family:var(--f-display);font-size:15px;text-transform:capitalize}
.fs-grille{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.fs-grille i{font-style:normal;font-size:9.5px;color:var(--muted);text-align:center;font-weight:700}
.fs-d{position:relative;height:22px;display:grid;place-items:center;font-size:10.5px;font-variant-numeric:tabular-nums;border-radius:5px;background:var(--soft);color:var(--ink)}
.fs-d.fs-we{background:color-mix(in srgb,var(--soft) 60%,var(--line))}
.fs-d.fs-be{box-shadow:inset 0 0 0 1.5px var(--sc-be)}
.fs-d.fs-lu{border-bottom:2px dashed var(--sc-lu)}
.fs-d.fs-fj{background:var(--sc-fj);color:#fff;font-weight:700}
.fs-d.fs-fer{font-weight:800}
.fs-d.fs-fer::after,.fs-d.fs-pont::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.fs-d.fs-pont::after{background:transparent;border:1.5px solid var(--accent);width:4px;height:4px}
.fs-d.fs-auj{outline:2px solid var(--ink);outline-offset:-1px}
.fs-lg-fer{color:var(--accent);font-size:18px;line-height:1}
.fs-bk{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.fs-bk span:last-child{min-width:0;overflow-wrap:anywhere}
.fs-bloc{display:grid;gap:4px;padding:14px}
.fs-ops{display:grid;margin-top:6px}
.fs-opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.fs-oh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fs-dates{font-size:14px;font-variant-numeric:tabular-nums}
.fs-st{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--muted)}
.fs-st.fs-libre{background:color-mix(in srgb,var(--ok) 18%,var(--door));color:var(--ok)}
.fs-st.fs-pris{background:color-mix(in srgb,var(--warn) 16%,var(--door));color:var(--warn)}
.fs-opt .btn{padding:8px 14px;font-size:14px}
.fs-d.fs-loc,.fs-lg-loc{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,var(--door)) 0 4px,color-mix(in srgb,var(--accent) 22%,var(--door)) 4px 8px);font-weight:700}
i.fs-lg-loc{display:inline-block;width:28px;height:15px;border-radius:999px;flex:none}
.fs-bk i.fs-lg-loc{width:18px;height:12px}
.fs-rappel{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--door));border-radius:12px;padding:10px 12px;font-size:14px}
.fs-grilleprix{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.fs-tarif{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.fs-tarif b{white-space:nowrap;font-variant-numeric:tabular-nums}
.fs-sel{user-select:text;-webkit-user-select:text;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fs-copie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}
.fs-f{background:var(--bg);display:grid;gap:10px;padding:14px}
.fs-ck{display:flex!important;gap:8px;align-items:center;align-self:end;padding-bottom:10px}
.fs-ck input{width:auto}
.fs-sum{cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px}
.fs-mail{display:grid;gap:6px;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:12px;min-width:0}
.fs-pre{white-space:pre-wrap;font:13px/1.45 var(--f-body);margin:0;background:var(--door);border-radius:8px;padding:8px;max-height:220px;overflow:auto}
.fs-cpt{display:grid;gap:6px;justify-items:start;min-width:130px}
.fr-page{display:grid;gap:14px;max-width:1040px;margin:0 auto;min-width:0}
/* La météo (préfixe mto-) */
.mto{display:grid;gap:3px;margin-top:4px;min-width:0}
.mto-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;font-size:13px;min-width:0}
.mto-lab{font-size:12px;color:var(--muted);font-weight:600}
b.mto-lab{color:var(--sc-fj)}
.mto-i{font-size:15px;line-height:1}
.mto-t{font-variant-numeric:tabular-nums;white-space:nowrap}
.mto-m{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.mto-m.mto-chaud{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--door))}
.mto-m.mto-bain{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--door))}
.mto-m.mto-frais,.mto-m.mto-prev{color:var(--sc-fj);background:color-mix(in srgb,var(--sc-fj) 14%,var(--door))}
.mto-j{display:inline-block;font-size:12.5px;border:1px solid color-mix(in srgb,var(--sc-fj) 45%,var(--line));border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mto-bloc{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.mto-lib{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.mto-mois-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 22px}
.mto-mois{display:grid;align-content:start;min-width:0}
.mto-s{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:13px;padding:5px 0;border-top:1px dashed var(--line);min-width:0}
.mto-s.mto-passe{opacity:.55}
.mto-d{min-width:6.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.mto-prevb{padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--sc-fj) 8%,var(--door))}
.fr-corps .row>.react,.fr-corps .row>.wa,.fr-corps .row>a.react{flex:none;min-width:0}
.fr-corps{display:grid;gap:14px;min-width:0}
.row.fr-suivi>.react,.fr-suivi .row>.react,.fr-suivi .row>label,.fr-suivi .fs-copie>.react,.fr-suivi .row>a.react{flex:none;min-width:0}
.fr-suivi .fs-copie{gap:6px 8px}
.fr-res{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.fr-res .stat{gap:3px;min-width:0}
.fr-res .stat span{overflow-wrap:anywhere}
.fr-sb{font-size:18px!important}
/* Réglementation et déclaration (préfixe rg-) */
a.react{color:var(--ink);text-decoration:none}
.rg-l{display:grid;gap:8px;margin-top:6px}
.rg-f{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.rg-f>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px;font-size:15px}
.rg-f[open]>summary{border-bottom:1px dashed var(--line)}
.rg-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:700;flex:none}
.rg-c{display:grid;gap:8px;padding:10px 12px 12px;font-size:14px;min-width:0}
.rg-ul{margin:0;padding-left:18px;display:grid;gap:5px}
.rg-tw{overflow-x:auto;min-width:0;max-width:100%}
.rg-t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.rg-t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:bottom}
.rg-t td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
.rg-t .rg-m{white-space:nowrap}
.rg-vu{animation:rgvu 1.6s ease-out}
@keyframes rgvu{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
/* Le compte (préfixe cp-) */
.cp-svg{width:100%;height:auto;display:block;overflow:visible}
.cp-c{fill:none;stroke:var(--sc-fj);stroke-width:2.2;stroke-linejoin:round}
.cp-l0{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.cp-ls{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 4}
.cp-g{stroke:var(--line);stroke-width:1}
.cp-tx{fill:var(--muted);font:10.5px var(--f-body);font-variant-numeric:tabular-nums}
.cp-txs{fill:var(--warn)}
.cp-pt{fill:var(--sc-fj)}
.cp-ptw{fill:var(--warn)}
.cp-neg{color:var(--warn)!important}
.cp-pos{color:var(--ok)}
.cp-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.cp-lg span{display:inline-flex;align-items:center;gap:6px}
.cp-lg i{display:inline-block;width:18px;height:0;border-top:2.2px solid var(--sc-fj)}
.cp-lg i.cp-lgs{border-top:1.5px dashed var(--warn)}
.cp-lg i.cp-lg0{border-top:1.5px dotted var(--muted)}
.cp-opts{display:grid;gap:6px;margin:4px 0}
.cp-opts label{display:flex;align-items:center;gap:8px;font-size:14px}
.cp-opts input{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--sc-fj)}
.fr-barres{display:grid;gap:6px}
.fr-barre{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.fr-barre span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-barre i{display:block;height:10px;width:var(--w);border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,var(--door)),color-mix(in srgb,var(--accent) 35%,var(--door)))}
.fr-barre b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-piece{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.fr-vign{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.fr-v{display:grid;gap:4px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--door);border-radius:12px;padding:6px;min-width:0;font-size:13px}
.fr-v img,.fr-vi{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:grid;place-items:center;background:var(--soft);font:800 26px var(--f-display);color:var(--muted)}
.fr-v b{overflow-wrap:anywhere;line-height:1.2}
.fr-ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.fr-l{font-variant-numeric:tabular-nums}
.fr-occ{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.fr-occ i{display:block;height:100%}
.o-fam{background:var(--sc-fj)}
.o-loc{background:var(--accent)}
.fr-pt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--soft);border:1px solid var(--line);margin-right:6px;vertical-align:-1px}

/* Empêche la même chose d'être enregistrée deux fois quand on touche deux fois le bouton. */
const RECENT=new Map();
const stable=v=>Array.isArray(v)?"["+v.map(stable).join(",")+"]"
  :(v&&typeof v==="object"?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}":JSON.stringify(v));
function empreinte(coll,data){ const d={...data}; delete d.at; delete d.id; return coll+"|"+stable(d); }
async function save(coll, data, id){
  if(!S.db){ toast("Connecte-toi à claude.ai pour enregistrer."); return false; }
  let emp=null;
  if(!id){
    emp=empreinte(coll,data); const t=Date.now();

    RECENT.set(emp,t);
  }
  try{

    else { await S.db.collection(coll).add(data); journal(coll,data); }
    return true;
  }catch(e){ if(emp) RECENT.delete(emp); toast(e?.code==="not_granted"?"Tu peux regarder, mais pas encore écrire : demande à Chouchou de te donner l'accès.":"Pas enregistré, réessaie dans un instant."); return false; }

/* ---------- La vie de la maison : qui fait quoi, qui est là ---------- */
/* Chaque geste devient une ligne du fil « Ça bouge à la maison ». Les gestes répétés d'une même
   personne en dix minutes se regroupent. Pour le stock (espace privé de chaque foyer), on compte
   les articles sans les nommer. */
const ONGLET_DE={range:"chez-nous",mange:"chez-nous",jete:"chez-nous",evenement:"calendrier",voyage:"voyages",weekend:"weekends",mot:"accueil",photo:"accueil",recette:"cuisine",envie:"cuisine",sortie:"loisirs",hotel:"loisirs"};
function journal(coll,d){
  try{
    if(coll==="stock") noter("range."+(d.place||"frais"),"");
    else if(coll==="events") noter("evenement",d.title||"");
    else if(coll==="ideas") noter(d.kind==="mot"?"mot":d.kind==="weekend"?"weekend":"voyage",d.title||"");
    else if(coll==="photos") noter("photo","");
    else if(coll==="recipes") noter(d.wish?"envie":"recette",d.title||"");
    else if(coll==="sorties") noter("sortie",d.nom||"");
    else if(coll==="hotels") noter("hotel",d.name||"");
  }catch{}
}
const ACT_ATTENTE=new Map();
async function noter(genre,detail){
  if(!S.db||!S.me) return;
  const base=genre.split(".")[0], seul=["mot","voyage","weekend","recette","envie"].includes(base);
  const depuis=Date.now()-10*60e3;
  const prec=!seul && S.activite.find(a=>a.member===S.me&&a.genre===genre&&(a.at||0)>depuis);
  try{
    if(prec){ const n=(+prec.n||1)+1; prec.n=n; prec.at=Date.now(); await S.db.collection("activite").doc(prec.id).update({n,detail,at:Date.now()}); }
    else{
      // deux gestes très rapprochés (une photo de ticket qui range 12 articles) : on attend le premier enregistrement
      if(!seul && ACT_ATTENTE.has(genre)){ ACT_ATTENTE.set(genre,ACT_ATTENTE.get(genre)+1); return; }
      if(!seul) ACT_ATTENTE.set(genre,1);
      const ref=await S.db.collection("activite").add({member:S.me,genre,detail,n:1,onglet:ONGLET_DE[base]||"accueil",at:Date.now()});
      const plus=(ACT_ATTENTE.get(genre)||1)-1; ACT_ATTENTE.delete(genre);
      // visible tout de suite pour le regroupement, sans attendre le retour de la base
      if(ref&&ref.id&&!S.activite.some(a=>a.id===ref.id)) S.activite.unshift({id:ref.id,member:S.me,genre,detail,n:1+plus,onglet:ONGLET_DE[base]||"accueil",at:Date.now()});
      if(plus>0&&ref&&ref.id){ try{ await S.db.collection("activite").doc(ref.id).update({n:1+plus,at:Date.now()}); }catch{} }
    }
  }catch{ ACT_ATTENTE.delete(genre); }
}
function phraseAct(a){
  const n=+a.n||1, x=n>1;
  switch(a.genre){
    case "range.frais": return x?"a rangé "+n+" articles au frais":"a rangé un article au frais";
    case "range.surgelateur": return x?"a mis "+n+" articles au surgélateur":"a mis un article au surgélateur";
    case "range.armoire": return x?"a rangé "+n+" articles dans les armoires":"a rangé un article dans les armoires";
    case "mange": return x?"a mangé "+n+" articles du stock":"a mangé un article du stock";
    case "jete": return x?"a jeté "+n+" articles":"a jeté un article";
    case "mot": return "a laissé un mot : « "+a.detail+" »";
    case "evenement": return x?"a ajouté "+n+" dates au calendrier":"a ajouté « "+a.detail+" » au calendrier";
    case "voyage": return "propose un voyage : "+a.detail;
    case "weekend": return "propose un week-end : "+a.detail;
    case "photo": return x?"a ajouté "+n+" photos au mur":"a ajouté une photo au mur";
    case "recette": return "a ajouté la recette « "+a.detail+" »";
    case "envie": return "a noté une envie : "+a.detail;
    case "sortie": return "était au restaurant « "+a.detail+" »";
    case "hotel": return "a noté l'hôtel « "+a.detail+" »";
    default: return a.detail||"";
  }
}

const VUS=new Map(); let vusPret=false;
function guetterNouveautes(){
  const frais=[];
  for(const a of S.activite){

function locNuit(d,T){
  const m=+d.slice(5,7), j=+d.slice(8,10);
  const sem=m===7||m===8?T.haute:m===6||(m===9&&j<=15)?T.moyenne:T.basse;
  const maj=schoolOn(d).be&&m!==7&&m!==8?1+(+T.majConges||0)/100:1;

function locPrix(s,e,pers,avecLinge){
  const T=locTarifs(), n=fjNuits(s,e); if(!n) return {n:0,loyer:0,menage:0,linge:0,total:0,min:false};
  let loyer=0; for(let d=s;d<e;d=fjAdd(d,1)) loyer+=locNuit(d,T);

const locMenageDu = l => l.statut==="confirmee"&&l.end>=todayIso()&&(l.menageStatut||"a-reserver")==="a-reserver"&&daysTo(l.start)<=15;
function locTuile(){
  const t=todayIso(), conf=S.locations.filter(l=>l.statut==="confirmee");
  /* Priorité : problème urgent > ménage à réserver > paiements > le reste (nouveau problème, brouillon prêt) */
  const urg=conf.filter(locUrgent).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(urg) return {p:"Problème urgent signalé · "+locNomC(urg),b:"!"};

  /* puis le compte de la petite maison : découvert ou seuil prévu */
  let cpe=null; try{ cpe=cpEtat(); const a=cpe.al.find(x=>x[2]==="decouvert"||x[2]==="seuil"); if(a) return {p:a[0],b:"€"}; }catch{}
  const rct=conf.filter(l=>locCtInfo(l).relance).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(rct) return {p:"Relancer pour le contrat signé · "+locNomC(rct),b:"!"};
  /* puis une facture ou une taxe en retard ou due sous 7 jours */
  const ech=frEcheances().find(e=>e.type!=="decl"&&e.jours<=7);

  if(ech) return {p:(ech.jours<0?"En retard · ":ech.jours===0?"À payer aujourd'hui · ":"À payer dans "+ech.jours+" j · ")+ech.lib,b:ech.jours<0?"!":"€"};
  /* puis une déclaration d'impôt à faire dans les 30 jours */
  { let dc=null; try{ dc=impDecls().filter(d=>daysTo(d.date)<=30).sort((a,b)=>a.date.localeCompare(b.date))[0]; }catch{}
    if(dc){ const j=daysTo(dc.date); return {p:(j<0?"En retard · ":j===0?"Aujourd'hui · ":"Dans "+j+" j · ")+dc.lib,b:"!"}; } }
  const du=conf.filter(locMenageDu).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(du) return {p:"Ménage à réserver · "+locNomC(du),b:"ménage"};
  const als=conf.flatMap(l=>locAlertes(l).filter(a=>a[1]==="warn"||a[2]<=7).map(a=>({l,a}))).sort((x,y)=>x.a[2]-y.a[2]);
  const alw=als.find(x=>x.a[1]==="warn");
  if(alw) return {p:alw.a[0]+" · "+locNomC(alw.l),b:"!"};
  if(frObligAvant().length) return {p:"Obligations à faire avant de louer",b:"!"};
  const al=als[0];
  if(al) return {p:al.a[0]+" · "+locNomC(al.l),b:al.a[1]==="warn"?"!":/Brouillon/.test(al.a[0])?"Gmail":""};

  if(enc) return {p:"Loué du "+fmtD(enc.start,{day:"numeric",month:"short"})+" au "+fmtD(enc.end,{day:"numeric",month:"short"})};
  return null;
}

function impDecls(){
  const T=locTarifs(), fait=frObligEtat("revenus").declare, y=+todayIso().slice(0,4);
  return IMP_DECL.map(([k,lib,ch,def])=>{ const jm=tsJour(T[ch])||def; let r=y-1; if(fait[r+"-"+k]||(k==="FR"&&frSansLoc(r))) r=y;
    if(k==="FR"&&frSansLoc(r)) return null;
    return {type:"decl",pays:k,annee:r,date:(r+1)+"-"+jm,montant:0,lib:(k==="BE"&&frSansLoc(r)?"Déclarer en Belgique le bien de Fréjus (aussi sans location, à confirmer avec le comptable)":lib)+" · revenus "+r}; }).filter(Boolean);

function frEcheances(){
  const out=[];
  S.fr_recurrents.filter(r=>r.prochaine&&/^\d{4}-\d{2}-\d{2}$/.test(r.prochaine)).forEach(r=>out.push({type:"rec",r,date:r.prochaine,montant:+r.montant||0,lib:r.libelle||"Facture"}));
  tsSemestres().forEach(s=>out.push({type:"ts",s,date:s.date,montant:s.total,lib:"Taxe de séjour à déclarer et reverser"}));
  try{ impDecls().forEach(d=>out.push(d)); }catch{}

}

const cpOpts = () => ({trv:S.cpTrv!=null?S.cpTrv:store.get("frigo.cptrv")==="1", loy:S.cpLoy!=null?S.cpLoy:store.get("frigo.cploy")!=="0"});
/* Les opérations prévues après le dernier solde, sur 90 jours. Un débit daté au plus tard le jour du dernier solde est déjà dans ce solde. */
function cpOps(D,o){
  const s0=D.soldes[D.soldes.length-1]; if(!s0) return null;
  const t=todayIso(), fin=fjAdd(s0.date>t?s0.date:t,90), ops=[];
  const add=(date,montant,lib,type,extra)=>{ if(montant&&date>s0.date&&date<=fin) ops.push({date,montant:Math.round(montant*100)/100,lib,type,...(extra||{})}); };
  S.fr_recurrents.forEach(r=>{ const m=+r.montant||0; if(!m||!cpIso(r.prochaine)) return; const pas=FR_PERIO_MOIS[r.periodicite];
    let d=r.prochaine; for(let k=0;k<60&&d<=fin;k++){ add(d,-m,r.libelle||"Facture","facture"); if(!pas) break; d=addMois(d,pas); } });
  tsSemestres().forEach(s=>add(s.date,-s.total,"Taxe de séjour ("+(s.s===1?"1er":"2e")+" semestre "+s.y+")","taxe"));
  if(o.trv) S.fr_travaux.forEach(x=>{ if(x.statut!=="fait"&&cpIso(x.datePrevue)&&+x.cout) add(x.datePrevue,-(+x.cout),"Travaux · "+(x.titre||""),"travaux"); });
  D.mouvements.forEach(m=>add(m.date,m.montant,m.libelle||(m.montant<0?"Débit":"Crédit"),"mouvement",{statut:m.statut}));
  D.versements.forEach(v=>add(v.date,v.montant,"Versement"+(v.note?" · "+v.note:""),"versement",{statut:v.statut}));
  if(o.loy){ const quand=d=>{ const x=cpIso(d)?d:t; return x>s0.date&&x>=t?x:(t>s0.date?t:fjAdd(s0.date,1)); };
    S.locations.filter(l=>l.statut==="confirmee"&&l.start).forEach(l=>{ const p=locPay(l);
      if(!p.acRecu&&p.ac>0) add(quand(p.acEch),p.ac,"Acompte · "+locNomC(l)+(p.acEch<t?" (en retard)":""),"loyer");
      if(!p.soRecu&&p.so>0) add(quand(p.soEch),p.so,"Solde · "+locNomC(l)+(p.soEch<t?" (en retard)":""),"loyer"); }); }
  ops.sort((a,b)=>a.date.localeCompare(b.date)||a.montant-b.montant);
  let s=s0.montant; ops.forEach(x=>{ s=Math.round((s+x.montant)*100)/100; x.solde=s; });
  return {s0,fin,ops};
}
function cpAnalyse(D,P){
  const out={alerte:"ok",date:null,versementConseille:null,avant:null,sous:null,neg:null,min:null,minDate:null,horsAutorise:false};
  if(!P) return out;
  const t=todayIso(), seuil=D.seuilAlerte, pts=[{date:P.s0.date,solde:P.s0.montant,credit:false},...P.ops.map(x=>({date:x.date,solde:x.solde,credit:x.montant>0}))];
  let mn=pts[0]; pts.forEach(p=>{ if(p.solde<mn.solde) mn=p; }); out.min=mn.solde; out.minDate=mn.date; out.horsAutorise=mn.solde< -D.decouvertAutorise;
  const i0=pts.findIndex(p=>p.solde<seuil); if(i0<0) return out;
  const j=pts.findIndex((p,k)=>k>i0&&p.credit), fen=pts.slice(i0,j<0?pts.length:j), m=Math.min(...fen.map(p=>p.solde));
  const neg=pts.find(p=>p.solde<0), cl=d=>d<t?t:d;
  out.sous=cl(pts[i0].date); out.neg=neg?cl(neg.date):null; out.alerte=neg?"decouvert":"seuil";
  out.versementConseille=Math.max(10,Math.ceil((seuil-m)/10)*10); out.avant=out.sous; out.date=neg?out.neg:out.sous;
  return out;
}
const cpCalc = (D,A) => ({maj:Date.now(),alerte:A.alerte,date:A.date,versementConseille:A.versementConseille,avant:A.avant});
function cpEtat(){
  const D=cpDoc(), P=cpOps(D,cpOpts()), A=cpAnalyse(D,P), s0=D.soldes[D.soldes.length-1], vieux=s0?Math.max(0,-daysTo(s0.date)):null, al=[];
  if(A.alerte==="decouvert") al.push([`Découvert prévu le ${ctJM(A.neg)} : verser au moins ${eur(A.versementConseille)} avant le ${ctJM(A.avant)}`,"fs-pris","decouvert"]);
  else if(A.alerte==="seuil") al.push([`Solde prévu sous le seuil le ${ctJM(A.sous)}`,"fs-pris","seuil"]);
  if(vieux!=null&&vieux>14) al.push([`Solde pas mis à jour depuis ${vieux} jours`,"fs-pris","vieux"]);
  if(!s0) al.push(["Solde à noter","","vide"]);
  else if(!al.length) al.push(["Solde suffisant sur 90 jours","fs-libre","ok"]);
  return {D,P,A,s0,vieux,al};
}
async function cpEcrire(D2,msg,libre){
  if(!libre&&!locAdmin()){ toast("Seuls Chouchou et Loulou modifient le compte."); return false; }
  const {calcule,existe,...rest}=D2;
  const doc={...rest,calcule:cpCalc(rest,cpAnalyse(rest,cpOps(rest,cpOpts()))),by:S.me,at:Date.now()};
  if(await save("meta",doc,"frejus-compte")){ const m=S.meta.find(x=>x.id==="frejus-compte"); if(m){ Object.keys(m).forEach(k=>{ if(k!=="id") delete m[k]; }); Object.assign(m,doc); } else S.meta.push({id:"frejus-compte",...doc});
    if(msg) toast(msg); return true; }
  return false;
}
/* Une facture payée ou une taxe reversée : le débit devient un mouvement « passé » (compté jusqu'à la prochaine mise à jour du solde) */
async function cpPasse(date,montant,libelle,source){

  D.mouvements=[...D.mouvements.filter(m=>!(source&&m.source===source&&m.date===date)),{id:cpId("m"),date,montant:-Math.abs(montant),libelle,statut:"passe",source}];

/* calcule : recalculé à l'ouverture de la section par Chouchou ou Loulou, pour la tâche quotidienne de Luc */
function cpCalcPlanifie(){
  if(!locAdmin()||!S.db) return; clearTimeout(S.cpT);
  S.cpT=setTimeout(async()=>{ if(S.fjSec!=="compte"||route()!=="frejus") return; const e=cpEtat(); if(!e.D.existe) return;
    const c=cpCalc(e.D,e.A), cle=JSON.stringify({...c,maj:0});
    if(cle===S.cpCle) return;
    try{ await S.db.collection("meta").doc("frejus-compte").update({calcule:c}); S.cpCle=cle; const m=S.meta.find(x=>x.id==="frejus-compte"); if(m) m.calcule=c; }catch{} },1200);
}
function cpCourbe(P,D){
  const W=360,H=176,pl=46,pr=10,pt=10,pb=24, d0=P.s0.date, d1=P.fin, span=Math.max(1,fjNuits(d0,d1));

  const mn=pts.reduce((a,b)=>b.solde<a.solde?b:a,pts[0]), t=todayIso(), fr=v=>Math.round(v).toLocaleString("fr-BE")+" €";

  const dl=d=>esc(fmtD(d,{day:"numeric",month:"short"})), mid=fjAdd(d0,Math.round(span/2));

    ${t>d0&&t<d1?`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${H-pb}" class="cp-g"/><text x="${X(t)}" y="${pt+8}" text-anchor="middle" class="cp-tx">auj.</text>`:""}
    <line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" class="cp-l0"/>${lab(0)}
    <line x1="${pl}" x2="${W-pr}" y1="${Y(D.seuilAlerte)}" y2="${Y(D.seuilAlerte)}" class="cp-ls"/>${Math.abs(D.seuilAlerte)>(hi-lo)*.06?lab(D.seuilAlerte,"cp-txs"):""}
    ${lab(hi-pad)}
    <path d="${path}" class="cp-c"/>
    <circle cx="${X(mn.date)}" cy="${Y(mn.solde)}" r="4" class="${mn.solde<D.seuilAlerte?"cp-ptw":"cp-pt"}"/>
    <text x="${pl}" y="${H-6}" class="cp-tx">${dl(d0)}</text><text x="${((+X(d0)+ +X(d1))/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="cp-tx">${dl(mid)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" class="cp-tx">${dl(d1)}</text></svg>

}

function frCreneaux(){
  /* Les périodes où la maison est vide : ni séjour famille ni location, hors juillet-août */
  const t=todayIso(), y0=+t.slice(0,4), out=[];
  const libre=(a,b)=>!fjPris(a,b).length&&!locConf(a,b).length;
  for(let k=0;k<14&&out.length<4;k++){
    const d=new Date(y0,+t.slice(5,7)-1+k,1), y=d.getFullYear(), m=d.getMonth()+1;
    if(m===7||m===8) continue;
    const a=y+"-"+String(m).padStart(2,"0")+"-01", b=fjAdd(iso(new Date(y,m,0)),1);
    if(b<=t||!libre(a>t?a:t,b)) continue;
    const lib=m<=3?"avant le 1er avril "+y:"en "+fmtD(a,{month:"long",year:"numeric"}); if(!out.includes(lib)) out.push(lib);
  }
  return [...new Set(out)];
}

/* Changer la date d'un moment, partout : le calendrier, l'accueil, et la tâche liée */
function evEdit(id){
  const e=S.events.find(x=>x.id===id); if(!e) return;
  const tache=e.tache?S.entretien.find(x=>x.id===e.tache):S.entretien.find(x=>e.title&&/^(Maison|Travaux) : /.test(e.title)&&e.title.replace(/^(Maison|Travaux) : /,"").replace(/ \(\d+h\d+\)$/,"")===x.name);
  const h=(e.title.match(/\((\d+)h(\d+)\)$/)||[]);
  const bg=sheet(`<h2>Changer la date</h2><p class="muted" style="margin:0"><b>${esc(e.title)}</b></p>
  <label>Titre<input id="ee-t" value="${esc(e.title.replace(/ \(\d+h\d+\)$/,""))}"></label>
  <div class="row"><label>Du<input type="date" id="ee-d" value="${esc(e.start)}"></label><label>Au<input type="date" id="ee-f" value="${esc(e.end||e.start)}"></label></div>
  <label>Heure <span class="hint">facultatif</span><input type="time" id="ee-h" value="${h[1]?h[1].padStart(2,"0")+":"+h[2]:""}"></label>
  ${tache?`<p class="hint" style="margin:0">La tâche « ${esc(tache.name)} » prend aussi cette nouvelle date.</p>`:""}
  <div class="row"><button class="btn ghost" data-close style="flex:none">Annuler</button><button class="btn accent" style="flex:none" id="ee-ok">Enregistrer</button></div>`);
  const q=x=>bg.querySelector(x);
  q("#ee-d").onchange=()=>{ if(q("#ee-f").value<q("#ee-d").value) q("#ee-f").value=q("#ee-d").value; };
  q("#ee-ok").onclick=async()=>{
    const d=q("#ee-d").value; if(!d){ toast("Choisis une date"); return; }
    const f=q("#ee-f").value>=d?q("#ee-f").value:d, hh=q("#ee-h").value, t=q("#ee-t").value.trim()||e.title;
    try{ await S.db.collection("events").doc(id).update({start:d,end:f,title:t+(hh?" ("+hh.replace(":","h")+")":"")});
      if(tache&&!(entFq(tache)===0&&tache.last)) await S.db.collection("entretien").doc(tache.id).update({next:d});

/* ---------- Calendrier ---------- */
function renderCal(){
  const base = S.month || new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  S.month = base;
  const y=base.getFullYear(), mo=base.getMonth();
  const first=new Date(y,mo,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const t=todayIso();
  const segs=(jours,test)=>{ const out=[]; let cur=null;
    jours.forEach((di,i)=>{ const l=test(di);
      if(l){ if(cur&&cur.l===l&&cur.e===i-1) cur.e=i; else { cur={s:i,e:i,l}; out.push(cur); } } else cur=null; });
    return out; };
  const bande=(list,cls)=>list.length?`<div class="wkband">${list.map(x=>`<span class="seg ${cls}" style="grid-column:${x.s+1} / ${x.e+2}" title="${esc(x.l)}">${esc(x.l)}</span>`).join("")}</div>`:"";
  let cells="";
  for(let w=0;w<6;w++){
    const ds=[]; for(let k=0;k<7;k++){ const d=new Date(start); d.setDate(start.getDate()+w*7+k); ds.push(d); }
    if(w===5 && ds[0].getMonth()!==mo) break;
    const jours=ds.map(iso);
    const fj=segs(jours,di=>{ const e=S.events.find(x=>x.type==="frejus"&&di>=x.start&&di<=(x.end||x.start)); return e?e.title:null; });
    const be=segs(jours,di=>schoolOn(di).be||null);
    const lu=segs(jours,di=>schoolOn(di).lu?"Luxembourg":null);
    cells+=bande(fj,"seg-fj")+bande(be,"seg-be")+bande(lu,"seg-lu")+PLUS(BANDES_PLUS,jours,segs,bande).join("");
    jours.forEach((di,k)=>{
      const d=ds[k];
      const evs=S.events.filter(e=>e.type!=="frejus"&&di>=e.start&&di<=(e.end||e.start)).concat(...PLUS(CAL_PLUS,di).filter(Array.isArray));
      const sc=schoolOn(di), scl=[sc.be?"congés scolaires en Belgique":"",sc.lu?"congés scolaires au Luxembourg":""].filter(Boolean).join(", ");
      cells+=`<button class="day ${d.getMonth()!==mo?"out":""} ${di===t?"today":""}" data-day="${di}" aria-label="${esc(fmtD(di,{weekday:"long",day:"numeric",month:"long"})+(scl?" — "+scl:""))}"><span class="n">${d.getDate()}</span>${PLUS(PASTILLES_PLUS,di).join("")}${evs.slice(0,3).map(e=>`<span class="bar" style="--c:${evColor(e)}">${esc(e.title)}</span>`).join("")}</button>`;
    });
  }
  const monthEv = S.events.filter(e=>(e.end||e.start)>=iso(first) && e.start<=iso(new Date(y,mo+1,0)));
  return `
  <div class="section-head"><div><div class="eyebrow">Le même calendrier pour tout le monde</div><h2 style="font-size:30px">Calendrier familial</h2></div><button class="btn accent" data-add="event">Ajouter une date</button></div>
  <div class="door section" style="margin-top:16px">
    <div class="cal-head"><button class="btn ghost" data-mo="-1" aria-label="Mois précédent">‹</button><h2>${first.toLocaleDateString("fr-BE",{month:"long",year:"numeric"})}</h2><button class="btn ghost" data-mo="1" aria-label="Mois suivant">›</button></div>
    <div class="cal">${["lun","mar","mer","jeu","ven","sam","dim"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="row" style="font-size:13px">${MEMBERS.map(m=>`<span style="display:inline-flex;gap:6px;align-items:center;flex:none;min-width:0">${mag(m.k,"sm")}${esc(m.n)}</span>`).join("")}</div>
    <div class="legend-sc"><span><i class="seg-fj"></i>Maison de Fréjus</span><span><i class="seg-be"></i>Congés scolaires en Belgique</span><span><i class="seg-lu"></i>au Luxembourg</span>${PLUS(LEGENDE_PLUS).join("")}</div>
  </div>
  ${schoolBlock(iso(first),iso(new Date(y,mo+1,0)))}
  <div class="door section"><h3>Ce mois-ci</h3><div>${monthEv.length?monthEv.map(evRow).join(""):`<div class="empty">Aucune date ce mois-ci. Touche un jour du calendrier pour en ajouter une.</div>`}</div></div>
  ${HOME_OF[S.me]==="luc"?renderEntretien():""}`;
}
function schoolBlock(a,b){
  const list=[];
  for(const k of ["be","lu"]) SCHOOL[k].forEach(([x,y,n])=>{ if(y>=a&&x<=b) list.push({k,x,y,n}); });
  if(!list.length) return "";
  list.sort((p,q)=>p.x.localeCompare(q.x));
  const d=(x,y)=>fmtD(x,{day:"numeric",month:"short"})+" → "+fmtD(y,{day:"numeric",month:"short"});
  return `<div class="door section"><h3>Les congés scolaires</h3>
    <div class="pick" style="margin-top:10px">${list.map(h=>`<span class="sc-chip"><i class="${h.k}"></i><b>${esc(h.n)}</b>
      <span class="muted">${esc(PAYS[h.k])} · ${esc(d(h.x,h.y))}</span></span>`).join("")}</div></div>`;
}

const valiseDefaut = () => VALISE.flatMap(([c,,items])=>items.map(t=>({t,c,d:false})));
async function openValise(ev){

      <div class="items" style="margin-top:6px">${list.map(i=>{const n=items.indexOf(i);return `<div class="item" style="grid-template-columns:auto 1fr auto;gap:10px;align-items:center">

      <div class="row" style="margin-top:10px"><button class="btn ghost" style="flex:none" id="v-ia">Claude complète la liste</button>
        <button class="btn ghost" style="flex:none" id="v-wa">Envoyer la liste</button>
        <button class="btn ghost" style="flex:none" id="v-raz">Tout décocher</button></div>
      <div id="v-out"></div></div>
    <div class="row"><button class="btn ghost" data-close>Fermer</button></div>`;
    const bg=sheet(html);
    const sauve=async()=>{ await save("packing",{event:ev.id,title:ev.title,items,by:S.me,at:Date.now()},ev.id); };
    bg.querySelectorAll("[data-v]").forEach(c=>c.onchange=async()=>{ items[+c.dataset.v].d=c.checked; await sauve(); dessine(); });
    bg.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=async()=>{ items.splice(+b.dataset.vdel,1); await sauve(); dessine(); });

        return "*"+nom+"*\n"+l.map(i=>(i.d?"☑ ":"☐ ")+i.t).join("\n"); }).filter(Boolean).join("\n\n");
      window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
    };

          await sauve(); dessine();
        });
        btn.disabled=false;
      }catch(e){ out.innerHTML=`<p class="muted" style="margin-top:10px">${esc(photoErr(e))}</p>`; btn.disabled=false; }
    };
  };
  dessine();
}

/* ---------- La cuisine qui donne envie, l'anti-gaspi, les courses, les promos et le menu de la semaine (préfixe cz) ---------- */ /* Collections : prix {produit (nom normalisé), nom, magasin, prix, unite, date, by, at} ; menus {semaine (lundi), foyer, jours:{lun:{midi:{recette,titre,ingredients},soir:{…}}…}, by, at} meta/magasins-<foyer> {liste:[magasins], autre, by, at} ; meta/promos {maj, semaine, items:[{magasin, produit, prix, prixNormal, fin, lien, pourquoi}]} (écrit par une tâche hebdomadaire) */ const CZ_MAGS=["Delhaize","Colruyt","Lidl","Aldi","Carrefour","Intermarché","Spar","Cora","Kruidvat"]; const CZ_JOURS=[["lun","Lundi"],["mar","Mardi"],["mer","Mercredi"],["jeu","Jeudi"],["ven","Vendredi"],["sam","Samedi"],["dim","Dimanche"]]; const CZ_FILTRES=[["tout","Tout"],["stock","Avec ce qu'on a"],["saison","De saison"],["budget","Petit budget"],["rapide","Rapide"],["favoris","Favoris"]]; const czMots = t => motsUtiles(t); const czMatch = (a,b) => a.some(m=>b.some(n=>m===n||m.startsWith(n)||n.startsWith(m))); const czStock = () => { const h=myHome(); return isUnlocked(h)?S.stock.filter(x=>x.home===h):[]; }; /* Ce qui expire dans 3 jours ou moins : le frais (durée de conservation) et les armoires (date) */ function czUrgents(){ const h=myHome(); if(!isUnlocked(h)) return []; const fr=freshList().filter(i=>i.left<=3).map(i=>({i,left:i.left})); const ar=S.stock.filter(x=>x.home===h&&x.place==="armoire"&&x.exp&&daysTo(x.exp)<=3).map(i=>({i,left:daysTo(i.exp)})); return [...fr,...ar].sort((a,b)=>a.left-b.left); } function czCouvre(r,stock,urg){ const ing=(r.ingredients||[]).filter(Boolean), sm=stock.map(s=>({s,m:czMots(s.name)})).filter(x=>x.m.length), um=new Set((urg||[]).map(u=>u.i.id)); const as=[], manque=[]; let bonus=0; ing.forEach(l=>{ const lm=czMots(l), hit=lm.length&&sm.find(x=>czMatch(lm,x.m)); if(hit){ as.push(hit.s.name); if(um.has(hit.s.id)) bonus++; } else manque.push(l); }); return {as:[...new Set(as)],manque,n:ing.length,score:ing.length?as.length/ function drawArt(cv){
  const w=cv.clientWidth||320,h=cv.clientHeight||180; cv.width=w*2; cv.height=h*2; const c=cv.getContext("2d"); c.scale(2,2);
  let seed=[...cv.dataset.art].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7); const rnd=()=>((seed=seed*1103515245+12345|0)>>>0)/4294967296;
  const pal=["#e2973a","#c8456b","#2c9a8a","#5f8a2e","#e5b437","#8a5cc2"];
  c.fillStyle="#f3ece0"; c.fillRect(0,0,w,h);
  c.fillStyle="#ffffff"; c.beginPath(); c.arc(w/2,h/2,Math.min(w,h)*.42,0,7); c.fill();
  c.strokeStyle="#e4dccd"; c.lineWidth=6; c.stroke();
  for(let i=0;i<14;i++){ c.fillStyle=pal[Math.floor(rnd()*pal.length)]; const a=rnd()*6.3, r=rnd()*Math.min(w,h)*.3; c.beginPath(); c.ellipse(w/2+Math.cos(a)*r,h/2+Math.sin(a)*r,6+rnd()*14,5+rnd()*9,rnd()*3,0,7); c.fill(); }
  c.fillStyle="#7a9a3a"; for(let i=0;i<8;i++){ c.beginPath(); c.ellipse(w/2+(rnd()-.5)*w*.5,h/2+(rnd()-.5)*h*.5,4,2,rnd()*3,0,7); c.fill(); }
}

    <div class="tm-nav"><button class="prev" ${i===0?"disabled style='opacity:.4'":""}>Précédent</button><button class="next">${i===steps.length-1?"C'est prêt !":"Suivant"}</button></div>`;
    el.querySelector(".close").onclick=quit; el.querySelector(".prev").onclick=()=>{ if(i>0){i--;draw();} };
    el.querySelector(".next").onclick=()=>{ if(i<steps.length-1){i++;draw();} else { quit(); toast("Bon appétit !"); czMarqueFait(r); setTimeout(()=>{ if(!r.photo) photoRecette(r.id,true); else askConsumed(r); },700); } };

  if(!ps.length) return `<div class="door section" style="padding:22px 20px"><h3 style="font-size:20px">Pièce par pièce</h3>
    <p class="muted" style="margin:8px 0 0;max-width:58ch">Pour chaque pièce : la dernière peinture des murs et du plafond (marque, gamme, teinte), le budget à prévoir, les portes à refaire en blanc voilier satiné brillant, les châssis et leur état, les prises et interrupteurs (ancien ou nouveau modèle, connectés ou pas), le radiateur et les luminaires. Quand une pièce est repeinte, une liste rappelle de revoir tout le reste en même temps.</p>
    <div class="row" style="margin-top:14px"><button class="btn accent" style="flex:none" data-pc="types:">Choisir nos pièces</button><button class="btn ghost" style="flex:none" data-pc="new:">Ajouter une pièce</button></div></div>`;
  const tot=ps.reduce((s,p)=>s+budgetPeinture(p).nous,0), totP=ps.reduce((s,p)=>s+budgetPeinture(p).peintre,0);
  const sansDate=ps.filter(p=>!((p.peinture||{}).murs||{}).date).length;
  const bp=ps.map(budgetPortes), nP=bp.reduce((s,b)=>s+b.n,0), pN=bp.reduce((s,b)=>s+b.nous,0), pP=bp.reduce((s,b)=>s+b.peintre,0);
  return `<div class="door section">
    <div class="stats"><div class="stat"><b>${ps.length}</b><span>pièces</span></div>

function renderChassis(){
  const cs=chassisTous();
  const f=S.chF||"tous";

    <p class="muted" style="margin:8px 0 0;max-width:56ch">Les châssis s'ajoutent dans chaque pièce : matière, vitrage, année, dimensions, état et joints. Ici, on les voit tous ensemble, du plus urgent au moins urgent, avec le budget de remplacement.</p>
    <div class="row" style="margin-top:14px"><button class="btn accent" style="flex:none" data-pc="tab:pieces">Aller aux pièces</button></div></div>`;
  const parEtat=n=>cs.filter(c=>+c.etat===n);
  const urg=cs.filter(c=>+c.etat>=3), budget=urg.reduce((s,c)=>s+prixChassis(c),0), b4=parEtat(4).reduce((s,c)=>s+prixChassis(c),0);
  const vus=cs.filter(c=>f==="tous"||(f==="joints"?c.joints==="refaire":f==="crois"?c.croisillons==="refaire":f==="simple"?/simple|ancien/.test(c.vitrage||""):+c.etat===+f))
    .sort((a,b)=>(+b.etat||0)-(+a.etat||0)||(+a.annee||9999)-(+b.annee||9999));
  const chip=(k,txt)=>`<button type="button" class="tag" data-pc="chf:${k}" style="flex:none;padding:7px 13px;cursor:pointer;border:2px solid ${f===k?"var(--ink)":"transparent"};${f===k?"background:color-mix(in srgb,var(--accent) 24%,var(--door));font-weight:700":""}">${txt}</button>`;

    <div class="stats"><div class="stat"><b>${cs.length}</b><span>châssis</span></div>
      <div class="stat" style="${parEtat(4).length?"border-color:var(--warn)":""}"><b style="${parEtat(4).length?"color:var(--warn)":""}">${parEtat(4).length}</b><span>à remplacer · ≈ ${esc(eur(b4))}</span></div>
      <div class="stat"><b>${parEtat(3).length}</b><span>à surveiller</span></div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${chip("tous","Tous")}${ETATS.map(([k,n,c])=>chip(String(k),`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:6px"></span>${n} · ${parEtat(k).length}`)).join("")}${chip("joints","Joints à refaire")}${chip("crois","Croisillons à poncer et peindre · "+cs.filter(c=>c.croisillons==="refaire").length)}${chip("simple","Simple ou vieux vitrage")}</div>

        <div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(c.piece)} — ${esc(c.ou||"châssis")}</b><b style="color:${e[2]};flex:none">${esc(e[1])}</b></div>
        <div class="meta">${esc((MATIERES.find(m=>m[0]===c.matiere)||["","matière ?"])[1])} · ${esc((VITRAGES.find(v=>v[0]===c.vitrage)||["","vitrage ?"])[1].toLowerCase())}${c.annee?" · "+esc(c.annee):""}${c.l&&c.h?" · "+esc(c.l)+" × "+esc(c.h)+" m":""} · joints ${c.joints==="refaire"?"à refaire":"bons"}${c.croisillons==="refaire"?" · croisillons à poncer et peindre en blanc":c.croisillons==="bons"?" · croisillons en bon état":""} · remplacement ≈ ${esc(eur(prixChassis(c)))}${nb(c.prix)?"":" (estimé)"}</div>
        ${c.note?`<div class="meta">${esc(c.note)}</div>`:""}</div>`; }).join("")||`<p class="muted" style="margin:8px 0">Aucun châssis dans ce choix.</p>`}</div>
    <p class="hint" style="margin:10px 0 0">Prix de remplacement posé estimés au m² (PVC ≈ 650 €, bois ≈ 900 €, alu ≈ 1 000 €) tant que tu n'as pas de devis : touche un châssis pour mettre le vrai prix.</p></div>`;
}
async function pcAction(v){
  const [a,id]=v.split(":");
  if(a==="tab"){ S.entTab=id; render(); return; }
  if(a==="lieu"){ S.lieu=id; S.entF={vue:"afaire",dom:""}; S.chF="tous"; render(); return; }
  if(a==="chf"){ S.chF=id; render(); return; }
  if(a==="new") return formPiece(null);
  if(a==="types") return choisirPieces();
  if(a==="mnew") return formMateriel(null);
  if(a==="dnew") return formPapier(null);
  if(a==="bk") return faireSauvegarde();
  if(a==="rs") return restaurerSauvegarde();
  if(a==="dnewf") return formPapier(null,"facture");
  if(a==="dedit"){ const d=S.papiers.find(x=>x.id===id); if(d) formPapier(d); return; }
  if(a==="dt"){ S.dT=id; render(); return; }
  if(a==="dpay"){ const d=S.papiers.find(x=>x.id===id); if(d) payerFacture(d); return; }
  if(a==="dag"){ const d=S.papiers.find(x=>x.id===id); if(d) factureAgenda(d); return; }
  if(a==="medit"){ const m=S.materiel.find(x=>x.id===id); if(m) formMateriel(m); return; }
  if(a==="mf"){ S.mF=id; render(); return; }
  if(a==="mc"){ S.mC=id; render(); return; }
  if(a==="edit"){ const p=S.pieces.find(x=>x.id===id); if(p) formPiece(p); }
}
function choisirPieces(){
  const deja=new Set(pcListe().map(p=>norm(p.nom)));
  const bg=sheet(`<h2>Nos pièces</h2><p class="muted" style="margin:0">Coche les pièces de la maison. Tu complètes ensuite chacune à ton rythme.</p>
    <div class="pick" id="pt">${(lieu()==="cabinet"?PIECES_CAB:PIECES_TYPES).map(n=>`<button type="button" class="tag" data-pt="${esc(n)}" aria-pressed="${deja.has(norm(n))}" ${deja.has(norm(n))?"disabled":""} style="padding:8px 14px;border:2px solid ${deja.has(norm(n))?"var(--ink)":"transparent"};${deja.has(norm(n))?"opacity:.5":""}">${esc(n)}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-close style="flex:none">Annuler</button><button class="btn accent" style="flex:none" id="pt-ok">Ajouter</button></div>`);
  bg.querySelectorAll("[data-pt]:not([disabled])").forEach(b=>b.onclick=()=>{ const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on); b.style.borderColor=on?"var(--ink)":"transparent"; b.style.background=on?"color-mix(in srgb,var(--accent) 24%,var(--door))":""; });
  bg.querySelector("#pt-ok").onclick=async()=>{
    const sel=[...bg.querySelectorAll('[data-pt][aria-pressed="true"]:not([disabled])')].map(b=>b.dataset.pt);
    let n=0;
    for(const nom of sel){ const niveau=/chambre|salle de bain|palier/i.test(nom)?"etage":/cave/i.test(nom)?"cave":/grenier/i.test(nom)?"grenier":"rez";
      try{ await S.db.collection("pieces").add({home:pcHome(),nom,niveau:lieu()==="cabinet"?"rez":niveau,lieu:lieu(),surface:0,hauteur:2.5,ordre:(lieu()==="cabinet"?PIECES_CAB:PIECES_TYPES).indexOf(nom),peinture:{},chassis:[],equip:{},reno:{},photos:[],by:S.me,at:Date.now()}); n++; }catch{} }
    closeSheet(); toast(n?n+" pièce"+(n>1?"s":"")+" ajoutée"+(n>1?"s":""):"Rien de coché");
  };
}

const MAT_CATS=[["electro","Outillage électroportatif","🔋"],["main","Outillage à main","🔧"],["jardin","Jardin","🌿"],["nettoyage","Nettoyage","🧽"],["menager","Électroménager","🍳"],["technique","Chauffage et technique","♨️"],["mesure","Mesure et laser","📏"],["acces","Échelles et échafaudage","🪜"],["auto","Voiture et recharge","🚗"],["autre","Autre","📦"]];
const MAT_ETATS=[["neuf","Neuf","var(--ok)"],["bon","Bon","var(--ok)"],["use","Usé","var(--accent)"],["reparer","À réparer","var(--warn)"],["hs","Hors service","var(--warn)"],["prete","Prêté","#7b8a94"]];
const MCAT=Object.fromEntries(MAT_CATS.map(c=>[c[0],c])), METAT=Object.fromEntries(MAT_ETATS.map(e=>[e[0],e]));
const matListe=()=>S.materiel.filter(x=>x.home===entHome()&&deLieu(x));
const finGarantie=m=>m.achat&&+m.garantie?addMois(m.achat,+m.garantie*12):"";
const ETAT_FACT={neuf:1,bon:.85,use:.6,reparer:.3,hs:.05,prete:.85};
function valeurs(m){
  const neuf=nb(m.vNeuf)||nb(m.prix)||0;
  let occ=nb(m.vOcc), est=false;
  if(!occ&&neuf){ const ans=m.achat?Math.max(0,daysSince(m.achat)/365):2;
    occ=Math.round(neuf*Math.max(.15,Math.pow(.85,ans))*(ETAT_FACT[m.etat]??.7)/5)*5; est=true; }
  return {neuf,occ,est,neufEst:!nb(m.vNeuf)};
}
const PROJETS=[["garder","On le garde"],["vendre","À vendre"],["racheter","À remplacer (racheter neuf)"],["acheter","À acheter (on ne l'a pas encore)"]];

/* --- Petit écrivain de classeur .xlsx (sans bibliothèque) --- */
const XL=(()=>{
  const enc=new TextEncoder();
  const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  const crc32=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zip(files){
    const parts=[], central=[]; let off=0;
    const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    for(const f of files){
      const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, crc=crc32(data);
      const head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
      parts.push(head,name,data);
      central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
      off+=head.length+name.length+data.length;
    }
    const cdSize=central.reduce((s,p)=>s+p.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
    return new Blob([...parts,...central,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
  const x=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col=n=>{ let s=""; n++; while(n){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  const serial=iso=>{ const [y,m,d]=iso.split("-").map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5; };
  /* Styles : on décrit chaque style par un nom ; l'index est calculé ici. */
  const FONTS=[
    '<font><sz val="11"/><color rgb="FF1D2734"/><name val="Calibri"/></font>',
    '<font><b/><sz val="18"/><color rgb="FF1D2734"/><name val="Calibri"/></font>',
    '<font><i/><sz val="10"/><color rgb="FF5D6B78"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FF1D2734"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FFC0582F"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FF9A5B0F"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FF2C6E62"/><name val="Calibri"/></font>',
    '<font><sz val="11"/><color rgb="FF5D6B78"/><name val="Calibri"/></font>',
    '<font><b/><sz val="12"/><color rgb="FF1D2734"/><name val="Calibri"/></font>'
  ];
  const FILLS=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1D2734"/></patternFill></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFFBE3D9"/></patternFill></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFFCEBD2"/></patternFill></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE1F0EC"/></patternFill></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEEF1F3"/></patternFill></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFF6F9F7"/></patternFill></fill>'];
  const BORDERS=['<border><left/><right/><top/><bottom/><diagonal/></border>',
    '<border><left/><right/><top/><bottom style="thin"><color rgb="FFD9E0DC"/></bottom><diagonal/></border>',
    '<border><left/><right/><top style="medium"><color rgb="FF1D2734"/></top><bottom/><diagonal/></border>'];
  const NUMFMTS='<numFmts count="3"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="#,##0 &quot;€&quot;"/><numFmt numFmtId="166" formatCode="0.0# &quot;h&quot;"/></numFmts>';
  const ST={}, XF=[];
  const def=(nom,{font=0,fill=0,border=1,num=0,wrap=true,h="",v="top",ind=0}={})=>{ ST[nom]=XF.length;
    XF.push(`<xf numFmtId="${num}" fontId="${font}" fillId="${fill}" borderId="${border}" xfId="0"${num?' applyNumberFormat="1"':""} applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="${v}"${h?` horizontal="${h}"`:""}${wrap?' wrapText="1"':""}${ind?` indent="${ind}"`:""}/></xf>`); };
  def("base",{border:0,wrap:false});
  def("titre",{font:1,border:0,wrap:false,v:"center"}); def("sous",{font:2,border:0,wrap:false});
  def("entete",{font:3,fill:2,border:0,v:"center",h:"left",ind:1});
  def("txt"); def("gras",{font:4}); def("gris",{font:8});
  def("date",{num:164,h:"center"}); def("eur",{num:165,h:"right"}); def("heures",{num:166,h:"right"}); def("nombre",{h:"center"});
  def("retard",{font:5,fill:3,h:"center"}); def("bientot",{font:6,fill:4,h:"center"}); def("plustard",{font:7,fill:5,h:"center"}); def("adater",{font:8,fill:6,h:"center"});
  def("totLib",{font:9,border:2,fill:7}); def("totEur",{font:9,border:2,fill:7,num:165,h:"right"}); def("totH",{font:9,border:2,fill:7,num:166,h:"right"}); def("totVide",{border:2,fill:7});
  def("bloc",{font:9,border:0,wrap:false});
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${NUMFMTS}<fonts count="${FONTS.length}">${FONTS.join("")}</fonts><fills count="${FILLS.length}">${FILLS.join("")}</fills><borders count="${BORDERS.length}">${BORDERS.join("")}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${XF.length}">${XF.join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  /* Une feuille : {nom, largeurs:[..], lignes:[[{v,s,f,date}]], fusions:["A1:J1"], gel: n lignes, filtre:"A4:J20", hauteurs:{ligne:pt}} */
  function feuille(sh){
    let rows="";
    sh.lignes.forEach((ligne,r)=>{ if(!ligne) return;
      const ht=sh.hauteurs&&sh.hauteurs[r+1];
      rows+=`<row r="${r+1}"${ht?` ht="${ht}" customHeight="1"`:""}>`;
      ligne.forEach((c,ci)=>{ if(c==null) return; const ref=col(ci)+(r+1), s=ST[c.s||"txt"]??0;
        if(c.f) rows+=`<c r="${ref}" s="${s}"><f>${x(c.f)}</f></c>`;
        else if(c.date) rows+=`<c r="${ref}" s="${s}"><v>${serial(c.date)}</v></c>`;
        else if(typeof c.v==="number") rows+=`<c r="${ref}" s="${s}"><v>${c.v}</v></c>`;
        else if(c.v===""||c.v==null) rows+=`<c r="${ref}" s="${s}"/>`;
        else rows+=`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${x(c.v)}</t></is></c>`; });
      rows+="</row>"; });
    const gel=sh.gel?`<sheetViews><sheetView workbookViewId="0" zoomScale="110"><pane ySplit="${sh.gel}" topLeftCell="A${sh.gel+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:`<sheetViews><sheetView workbookViewId="0" zoomScale="110"/></sheetViews>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>${gel}<sheetFormatPr defaultRowHeight="18"/><cols>${sh.largeurs.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData>${sh.filtre?`<autoFilter ref="${sh.filtre}"/>`:""}${(sh.fusions||[]).length?`<mergeCells count="${sh.fusions.length}">${sh.fusions.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`:""}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  }
  function classeur(feuilles){
    const files=[
      {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${feuilles.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
      {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
      {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${feuilles.map((f,i)=>`<sheet name="${x(f.nom.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>${feuilles.some(f=>f.filtre)?`<definedNames>${feuilles.map((f,i)=>f.filtre?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(f.nom.slice(0,31))}'!$${f.filtre.replace(":",":$").replace(/([A-Z]+)(\d+)/g,"$1$$$2")}</definedName>`:"").join("")}</definedNames>`:""}</workbook>`},
      {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${feuilles.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${feuilles.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
      {name:"xl/styles.xml",data:stylesXml},
      ...feuilles.map((f,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:feuille(f)}))
    ];
    return zip(files);
  }
  return {classeur,col};
})();

/* --- Export de l'entretien en tableur --- */
function feuillesEntretien(list, o){
  /* o : {lieuNom, auj, quand(i), statut(i) -> [clé, libellé], cat(k) -> nom, duree(i), freq(m), annee:{YYYY-MM:{n,cout,quoi}}, moisNom(k), dateLongue} */
  const ordre={retard:0,bientot:1,plustard:2,adater:3};
  const rows=list.map(i=>({i,st:o.statut(i)})).sort((a,b)=>ordre[a.st[0]]-ordre[b.st[0]]||(a.i.next||"9999").localeCompare(b.i.next||"9999"));
  const n=rows.length, budget=Object.values(o.annee).reduce((s,m)=>s+m.cout,0);
  const compte=k=>rows.filter(r=>r.st[0]===k).length;
  const A=[];
  A[0]=[{v:"Entretien "+o.lieuNom+" — Les Willys",s:"titre"}];
  A[1]=[{v:`Exporté le ${o.dateLongue} · ${n} tâches · ${compte("retard")} en retard · ${compte("bientot")} dans les 60 jours · ${Math.round(budget).toLocaleString("fr-BE")} € à prévoir sur 12 mois`,s:"sous"}];
  A[2]=null;
  const H=["Statut","Prochaine fois","Domaine","Tâche","Qui","Durée","Coût","Fréquence","Dernière fois","Note"];
  A[3]=H.map(v=>({v,s:"entete"}));
  rows.forEach(({i,st},k)=>{
    A[4+k]=[{v:st[1],s:st[0]},i.next?{date:i.next,s:"date"}:{v:"à dater",s:"gris"},{v:o.cat(i.cat),s:"txt"},{v:i.name||"",s:"gras"},
      {v:i.qui==="artisan"?"Artisan":"Nous",s:"nombre"},{v:Math.round((o.duree(i)||0)*100)/100,s:"heures"},{v:+i.cost||0,s:"eur"},
      {v:o.freq(entFq(i)),s:"txt"},i.last?{date:i.last,s:"date"}:{v:"—",s:"gris"},{v:[i.note,(i.materiel||[]).length?"Matériel : "+i.materiel.map(m=>m.quoi+(m.qte?" ("+m.qte+")":"")).join(", "):""].filter(Boolean).join(" · "),s:"gris"}];
  });
  const fin=4+n, last=fin; // ligne Excel du dernier élément = fin
  A[fin]=[{v:"Total",s:"totLib"},{v:"",s:"totVide"},{v:"",s:"totVide"},{v:n+" tâches",s:"totLib"},{v:"",s:"totVide"},{f:`SUM(F5:F${last})`,s:"totH"},{f:`SUM(G5:G${last})`,s:"totEur"},{v:"",s:"totVide"},{v:"",s:"totVide"},{v:"",s:"totVide"}];
  const f1={nom:"À faire",largeurs:[15,15,22,44,10,10,12,18,15,60],lignes:A,fusions:["A1:J1","A2:J2"],gel:4,filtre:`A4:J${last}`,hauteurs:{1:30,4:24}};
  /* Mois par mois */
  const B=[[{v:"L'année qui vient, mois par mois",s:"titre"}],[{v:"Les tâches répétitives comptées à chaque passage · gros travaux à dater non compris",s:"sous"}],null,
    ["Mois","Tâches","Coût","Quoi"].map(v=>({v,s:"entete"}))];
  const mk=Object.keys(o.annee).sort();
  mk.forEach((k,j)=>{ const m=o.annee[k]; B[4+j]=[{v:o.moisNom(k),s:"gras"},{v:m.n,s:"nombre"},{v:m.cout,s:"eur"},{v:m.tout.join(", "),s:"gris"}]; });
  const bl=4+mk.length;
  B[bl]=[{v:"Total sur 12 mois",s:"totLib"},{f:`SUM(B5:B${bl})`,s:"totLib"},{f:`SUM(C5:C${bl})`,s:"totEur"},{v:"",s:"totVide"}];
  const f2={nom:"Mois par mois",largeurs:[18,10,13,90],lignes:B,fusions:["A1:D1","A2:D2"],gel:4,hauteurs:{1:30,4:24}};
  /* Par domaine */
  const doms={};
  list.forEach(i=>{ const d=doms[i.cat]=doms[i.cat]||{n:0,an:0,h:0,gros:0};
    const fq=entFq(i), parAn=fq?12/Math.max(1,fq):0; d.n++; d.an+=(+i.cost||0)*parAn; d.h+=(o.duree(i)||0)*(i.qui==="artisan"?0:parAn);
    if(fq>=60||fq===0) d.gros+=+i.cost||0; });
  const dk=Object.keys(doms).sort((a,b)=>doms[b].an-doms[a].an);
  const C=[[{v:"Par domaine",s:"titre"}],[{v:"Coût moyen ramené à l'année (un ravalement tous les 10 ans compte pour un dixième par an) · heures de travail pour nous",s:"sous"}],null,
    ["Domaine","Tâches","Coût moyen / an","Heures / an (nous)","Gros travaux (coût total)"].map(v=>({v,s:"entete"}))];
  dk.forEach((k,j)=>{ const d=doms[k]; C[4+j]=[{v:o.cat(k),s:"gras"},{v:d.n,s:"nombre"},{v:Math.round(d.an),s:"eur"},{v:Math.round(d.h*10)/10,s:"heures"},{v:d.gros,s:"eur"}]; });
  const cl=4+dk.length;
  C[cl]=[{v:"Total",s:"totLib"},{f:`SUM(B5:B${cl})`,s:"totLib"},{f:`SUM(C5:C${cl})`,s:"totEur"},{f:`SUM(D5:D${cl})`,s:"totH"},{f:`SUM(E5:E${cl})`,s:"totEur"}];
  const f3={nom:"Par domaine",largeurs:[26,10,17,19,24],lignes:C,fusions:["A1:E1","A2:E2"],gel:4,hauteurs:{1:30,4:24}};
  const feuilles=[f1,f2,f3];
  /* Matériel */
  const mats=list.flatMap(i=>(i.materiel||[]).map(m=>({t:i.name,m,mag:i.magasin==="autre"?i.magasinNom:i.magasin})));
  if(mats.length){
    const D=[[{v:"Le matériel à acheter",s:"titre"}],[{v:"Prix notés dans les tâches · « estimé » quand ils viennent de Claude",s:"sous"}],null,
      ["Pour la tâche","Matériel","Quantité","Prix","Magasin","Note"].map(v=>({v,s:"entete"}))];
    mats.forEach((x,j)=>{ D[4+j]=[{v:x.t,s:"gras"},{v:x.m.quoi||"",s:"txt"},{v:x.m.qte||"",s:"txt"},{v:+x.m.prix||0,s:"eur"},{v:x.mag||"",s:"txt"},{v:x.m.note||"",s:"gris"}]; });
    const dl=4+mats.length;
    D[dl]=[{v:"Total",s:"totLib"},{v:"",s:"totVide"},{v:"",s:"totVide"},{f:`SUM(D5:D${dl})`,s:"totEur"},{v:"",s:"totVide"},{v:"",s:"totVide"}];
    feuilles.push({nom:"Matériel",largeurs:[36,42,18,12,16,40],lignes:D,fusions:["A1:F1","A2:F2"],gel:4,hauteurs:{1:30,4:24}});
  }
  return feuilles;
}


async function exportEntretien(){
  const list=entListe(); if(!list.length){ toast("Rien à exporter pour l'instant"); return; }
  const auj=todayIso();
  const o={lieuNom:lieu()==="cabinet"?"du cabinet":"de la maison",dateLongue:fmtD(auj,{weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    statut:i=>i.fait?["adater","Fait"]:!i.next?["adater","À dater"]:(!i.neuf&&i.left<0)?["retard","En retard"]:i.left<=60?["bientot",i.neuf&&i.left<=0?"À planifier":"Bientôt"]:["plustard","Plus tard"],
    cat:k=>(ENT_CAT[k]||["","Autre"])[1], duree:entDuree, freq:freqTxt, annee:entAnnee(list),
    moisNom:k=>{ const t=fmtD(k+"-15",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); }};
  try{
    const blob=XL.classeur(feuillesEntretien(list,o));
    const dl=await window.claude?.use?.("downloads");
    const nom="entretien-"+(lieu()==="cabinet"?"cabinet":"maison")+"-"+auj+".xlsx";
    if(!dl){ toast("Le téléchargement n'est pas disponible dans cette vue."); return; }
    await dl.save({filename:nom,data:blob}); toast("Tableur prêt : "+nom);
  }catch(e){ toast(e&&e.code==="declined"?"Export annulé":"Le tableur n'a pas pu être créé."); }
}


function entAgenda(i){
  const d0=entProchain(i)||todayIso(), jour=d0<todayIso()?todayIso():d0;
  const lib=i.cat==="travaux"?"Travaux":"Maison";
  const bg=sheet(`<h2>À l'agenda</h2><p class="muted" style="margin:0"><b>${esc(i.name)}</b>${entDuree(i)?" · environ "+esc(dureeTxt(entDuree(i))):""}</p>
  <div class="row"><label>Du<input type="date" id="ag-d" value="${jour}"></label><label>Au<input type="date" id="ag-f" value="${jour}"></label></div>
  <div class="row"><label>Heure <span class="hint">facultatif</span><input type="time" id="ag-h" placeholder="09:00"></label>
    <label>Qui ?<select id="ag-q"><option value="chouchou,loulou">Chouchou et Loulou</option><option value="chouchou">Chouchou</option><option value="loulou">Loulou</option></select></label></div>
  <p class="hint" style="margin:0">La date choisie devient aussi la prochaine fois de cette tâche.</p>
  <div class="row"><button class="btn ghost" data-close style="flex:none">Annuler</button><button class="btn accent" style="flex:none" id="ag-ok">Mettre à l'agenda</button></div>`);
  const q=id=>bg.querySelector(id);
  q("#ag-d").onchange=()=>{ if(q("#ag-f").value<q("#ag-d").value) q("#ag-f").value=q("#ag-d").value; };
  q("#ag-ok").onclick=async()=>{
    const d=q("#ag-d").value; if(!d){ toast("Choisis une date"); return; }
    const f=q("#ag-f").value>=d?q("#ag-f").value:d, h=q("#ag-h").value;
    const ok=await save("events",{type:"ensemble",title:lib+" : "+i.name+(h?" ("+h.replace(":","h")+")":""),start:d,end:f,people:q("#ag-q").value.split(","),tache:i.id,by:S.me,at:Date.now()});
    if(ok){ try{ await S.db.collection("entretien").doc(i.id).update({next:d}); }catch{}
      closeSheet(); toast("À l'agenda le "+fmtD(d,{weekday:"long",day:"numeric",month:"long"})); }
  };
}


/* --- Sauvegarde et restauration --- */
const derniereSauvegarde=()=>{ const m=S.meta.find(x=>x.id==="sauvegarde"); return m&&m.at?m:null; };
function renderSauvegarde(){
  const m=derniereSauvegarde(), j=m?Math.floor((Date.now()-m.at)/864e5):null;
  return `<div class="door section">
    <div class="eyebrow">Toutes les données, les documents et les photos</div>

async function blobB64(url){ const r=await fetch(url); const b=await r.blob(); return await new Promise((ok,ko)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=ko; fr.readAsDataURL(b); }); }
async function faireSauvegarde(){
  if(!S.db){ toast("Connecte-toi à claude.ai pour sauvegarder."); return; }
  toast("Préparation de la sauvegarde…");
  const out={source:"les-willys",version:1,date:new Date().toISOString(),par:S.me,collections:{},fichiers:{}};
  let n=0;
  for(const c of COLLECTIONS.concat(["meta"])){
    try{ const snap=await S.db.collection(c).get(); const docs={}; snap.docs.forEach(d=>{ docs[d.id]=d.data(); n++; }); if(Object.keys(docs).length) out.collections[c]=docs; }catch{}
  }
  const ids=new Set(); Object.values(out.collections.papiers||{}).forEach(d=>(d.fichiers||[]).forEach(f=>f.id&&ids.add(f.id+"|"+f.url+"|"+(f.nom||"")+"|"+(f.type||""))));
  Object.values(out.collections.bons||{}).forEach(d=>d.photoId&&d.photo&&ids.add(d.photoId+"|"+d.photo+"|bon|image/jpeg"));
  for(const k of ids){ const [id,url,nom,type]=k.split("|"); try{ out.fichiers[id]={nom,type,b64:await blobB64(url)}; }catch{} }
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  try{
    const dl=await window.claude?.use?.("downloads");
    if(!dl){ toast("Le téléchargement n'est pas disponible dans cette vue."); return; }
    await dl.save({filename:"les-willys-sauvegarde-"+todayIso()+".json",data:blob});
    try{ await S.db.collection("meta").doc("sauvegarde").set({at:Date.now(),par:S.me,n}); }catch{}
    toast("Sauvegarde prête — range-la dans Fichiers › iCloud");
  }catch(e){ toast(e&&e.code==="declined"?"Sauvegarde annulée":"La sauvegarde n'a pas pu être créée."); }
}
function restaurerSauvegarde(){
  const bg=sheet(`<h2>Restaurer une sauvegarde</h2>
  <p class="muted" style="margin:0">Choisis un fichier « les-willys-sauvegarde-….json ». Tout ce qu'il contient est remis en place. Ce qui a été ajouté depuis reste, mais un élément présent des deux côtés reprend sa version de la sauvegarde.</p>
  <input type="file" id="rs-f" accept="application/json,.json">
  <p class="hint" id="rs-st" style="margin:0"></p>
  <div class="row"><button class="btn ghost" data-close style="flex:none">Fermer</button><button class="btn accent" style="flex:none" id="rs-go" disabled>Restaurer</button></div>`);
  let data=null; const st=bg.querySelector("#rs-st"), go=bg.querySelector("#rs-go");
  bg.querySelector("#rs-f").onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{ data=JSON.parse(await f.text()); if(data.source!=="les-willys"||!data.collections) throw 0;
      const n=Object.values(data.collections).reduce((s,c)=>s+Object.keys(c).length,0);
      st.textContent=`Sauvegarde du ${new Date(data.date).toLocaleString("fr-BE")} : ${n} éléments, ${Object.keys(data.fichiers||{}).length} fichier(s) joint(s).`; go.disabled=false;
    }catch{ data=null; go.disabled=true; st.textContent="Ce fichier n'est pas une sauvegarde des Willys."; } };
  go.onclick=async()=>{ if(!data) return; go.disabled=true;
    const map={}; const as=await assetsNs();
    for(const [id,f] of Object.entries(data.fichiers||{})){
      if(!as) break;
      try{ const bin=Uint8Array.from(atob(f.b64),c=>c.charCodeAt(0)); const r=await as.upload(new Blob([bin],{type:f.type||"application/pdf"})); map[id]={id:r.id,url:r.url}; }catch{}
    }
    let n=0;
    for(const [c,docs] of Object.entries(data.collections)){
      for(const [id,d] of Object.entries(docs)){
        let x=d;
        if(c==="papiers"&&Array.isArray(d.fichiers)) x={...d,fichiers:d.fichiers.map(f=>map[f.id]?{...f,...map[f.id]}:f)};
        if(c==="bons"&&d.photoId&&map[d.photoId]) x={...d,photo:map[d.photoId].url,photoId:map[d.photoId].id};
        try{ await S.db.collection(c).doc(id).set(x); n++; }catch{}
        if(n%25===0) st.textContent="Restauration… "+n+" éléments";
      }
    }
    st.textContent="Terminé : "+n+" éléments remis en place."; toast("Sauvegarde restaurée");
  };
}

function freezerBody(){

  const hitD=new Set(hits.map(i=>+i.drawer||DRAWERS));
  let out="";
  for(let d=1;d<=DRAWERS;d++){
    const its=items.filter(i=>(+i.drawer||DRAWERS)===d), cat=CATS.find(c=>c.drawer===d);
    const open=(q?hitD.has(d):S.openDrawer===d);
    out+=`<button class="drawer${q&&hitD.has(d)?" hit":""}" data-drawer="${d}" style="--c:${cat?cat.c:"var(--muted)"}" aria-expanded="${open}">
      <span class="handle"></span><span style="min-width:0"><b>${cat?esc(cat.n):"Divers"}</b>
      <div class="cnt">Tiroir ${d} · ${its.length?its.length+(its.length>1?" articles":" article"):"vide"}</div></span>
      <span class="cnt">${open?"▲":"▼"}</span></button>`;
    if(open) out+=`<div class="door" style="border-radius:10px;padding:4px 14px"><div class="items">${its.length?its.map(i=>stockRow(i,q)).join(""):`<p class="muted" style="margin:10px 0">Ce tiroir est vide.</p>`}</div></div>`;

      <span><b>${bilan.jete}</b> jeté${bilan.jete>1?"s":""}${bilan.perdu?` <span class="muted">· ${esc(eur(bilan.perdu))} perdus</span>`:""}</span>

    ${bloc("Ça presse",bientot,"")}
    ${bloc("Le reste",reste,"")}
    ${!list.length?`<div class="door"><b>Le frigo est vide.</b><p class="muted" style="margin:6px 0 0">Plus rien à trier — profites-en pour le passer à l'éponge.</p></div>`:""}
    <div class="row"><button class="btn accent" id="net-fin" style="flex:none">${list.length?"Terminer le nettoyage":"Fermer"}</button></div>`);
    bg.querySelectorAll("[data-net]").forEach(b=>b.onclick=async()=>{
      const [act,id]=b.dataset.net.split(":");

/* ---------- La prime du trimestre ---------- */
const qNow = () => { const d=new Date(); return {y:d.getFullYear(),q:Math.floor(d.getMonth()/3)+1}; };
const qBornes = (y,q) => [new Date(y,(q-1)*3,1).getTime(), new Date(y,q*3,1).getTime()];
const qNom = (y,q) => ["janvier–mars","avril–juin","juillet–septembre","octobre–décembre"][q-1]+" "+y;
const qPrec = (y,q) => q===1?{y:y-1,q:4}:{y,q:q-1};
function bilanTrim(y,q){
  const [a,b]=qBornes(y,q);
  return HOMES.map(H=>{
    const gagne=S.boni.filter(x=>x.home===H.k&&x.at>=a&&x.at<b).reduce((s,x)=>s+(+x.value||0),0);
    const perdu=S.waste.filter(x=>x.home===H.k&&x.at>=a&&x.at<b).reduce((s,x)=>s+(+x.value||0),0);
    return {h:H.k,n:H.n,gagne,perdu,net:Math.max(0,Math.round((gagne-perdu)*100)/100)};
  });
}
const ibanDoc = h => S.ibans.find(x=>x.id===h);
function ibanOk(v){
  const s=String(v||"").replace(/[\s-]/g,"").toUpperCase();
  if(!/^[A-Z]{2}[0-9A-Z]{13,32}$/.test(s)) return false;
  const r=s.slice(4)+s.slice(0,4);
  let reste=0; for(const c of r){ const d=/[0-9]/.test(c)?c:String(c.charCodeAt(0)-55); for(const x of d) reste=(reste*10+ +x)%97; }
  return reste===1;
}
const ibanFmt = v => String(v||"").replace(/[\s-]/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim();
const ibanMask = v => { const s=ibanFmt(v); return s.length>9 ? s.slice(0,7)+" ···· "+s.slice(-4) : s; };

  <div class="door full"><div class="section-head"><h3>Les trimestres passés</h3></div>

  </div>`;
}

function pertes(){
  const h=myHome(), w=S.waste.filter(x=>x.home===h).sort((a,b)=>b.at-a.at), now=Date.now();
  const som=a=>a.reduce((s,x)=>s+(+x.value||0),0);
  const m30=w.filter(x=>x.at>=now-30*864e5), m60=w.filter(x=>x.at<now-30*864e5&&x.at>=now-60*864e5);
  const mois=[], d0=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(d0.getFullYear(),d0.getMonth()-i,1), f=new Date(d.getFullYear(),d.getMonth()+1,1);
    const l=w.filter(x=>x.at>=d.getTime()&&x.at<f.getTime());
    mois.push({label:d.toLocaleDateString("fr-BE",{month:"short"}).replace(".",""),n:l.length,v:som(l)}); }
  const par={};
  w.filter(x=>x.at>=now-180*864e5).forEach(x=>{ const k=norm(x.name).split(" ").slice(0,2).join(" ");
    if(!par[k]) par[k]={name:x.name,n:0,v:0}; par[k].n++; par[k].v+=+x.value||0; });
  const recurrents=Object.values(par).filter(x=>x.n>1).sort((a,b)=>b.n-a.n).slice(0,3);
  const courses30=S.tickets.filter(t=>t.home===h&&t.date&&new Date(t.date+"T12:00:00").getTime()>=now-30*864e5)
    .reduce((s,t)=>s+(+t.total||0),0);
  return {w,m30,m60,v30:som(m30),v60:som(m60),mois,recurrents,courses30,
    sansPrix:m30.filter(x=>!+x.value).length, sansTout:w.filter(x=>!+x.value).length, total:som(w)};
}

const BAKES=[["pain","Pains"],["petits","Petits pains"],["crepes","Crêpes"],["autre","Autre"]];
function renderBaker(){
  const h=myHome();
  const bakes=S.bakes.filter(b=>b.home===h).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const sacks=S.flours.filter(f=>f.home===h).sort((a,b)=>(b.bought||"").localeCompare(a.bought||""));
  const used=bakes.reduce((s,b)=>s+(+b.kg||0),0), bought=sacks.reduce((s,f)=>s+(+f.kg||0),0), left=Math.max(0,bought-used);
  const dates=bakes.map(b=>b.date).filter(Boolean).slice(0,8);
  let interval=null;
  if(dates.length>=2){ let t=0; for(let i=0;i<dates.length-1;i++) t+=(new Date(dates[i])-new Date(dates[i+1]))/864e5; interval=t/(dates.length-1); }
  const perBake=bakes.length?used/bakes.length:0;
  const daysLeft=(interval&&perBake)?Math.round(left/perBake*interval):null;
  const toTreat=sacks.filter(f=>!f.treated);
  const old=sacks.filter(f=>f.treated&&daysSince(f.bought)>90);
  return `<div class="section cols">
  ${toTreat.length?`<div class="door full" style="border-color:var(--warn)"><h3>Au retour du moulin</h3>
    <p style="margin:6px 0 0">Le sac passe 48 heures au surgélateur contre les mites, puis se transvase en bocaux hermétiques.</p>
    <div class="items" style="margin-top:8px">${toTreat.map(f=>`<div class="item warn"><div><b>${esc(f.name)}</b><div class="meta">acheté ${since(f.bought)}${daysSince(f.bought)<2?" · laisse-le encore au froid":" · bon pour le transvasement"}</div></div>
      <button class="react" data-treated="${f.id}">C'est transvasé</button></div>`).join("")}</div></div>`:""}
  ${daysLeft!==null&&daysLeft<14?`<div class="door full" style="border-color:var(--warn)"><h3>Pense à recommander</h3>
    <p style="margin:6px 0 0">À ce rythme, il reste de la farine pour environ ${daysLeft} jour${daysLeft>1?"s":""}. Loulou passe au moulin près de Grez-Doiceau.</p>
    ${wa("Pense à prendre de la farine au moulin : il reste environ "+left.toFixed(1)+" kg, soit "+daysLeft+" jours.")}</div>`:""}
  <div class="stats">
    <div class="stat"><b>${left.toFixed(1).replace(".",",")} kg</b><span>Farine en stock</span></div>
    <div class="stat"><b>${interval?Math.round(interval)+" j":"—"}</b><span>Entre deux fournées</span></div>
    <div class="stat"><b>${daysLeft!==null?daysLeft+" j":"—"}</b><span>Avant d'en manquer</span></div>
  </div>
  ${old.length?`<div class="door full"><h3>Cette farine traîne</h3><div class="items" style="margin-top:8px">${old.map(f=>`<div class="item"><div><b>${esc(f.name)}</b><div class="meta">au placard depuis ${since(f.bought)} · à utiliser avant qu'elle ne rancisse</div></div><button class="react" data-del="flours:${f.id}">Finie</button></div>`).join("")}</div></div>`:""}
  <div class="door"><div class="section-head"><h3>Les fournées</h3><button class="btn accent" data-add="bake">Nouvelle fournée</button></div>
    <div class="items" style="margin-top:8px">${bakes.length?bakes.slice(0,14).map(b=>`<div class="item"><div style="min-width:0"><b>${esc((BAKES.find(x=>x[0]===b.kind)||["","Fournée"])[1])}</b>${b.n?` <span class="muted">· ${esc(b.n)}</span>`:""}
      <div class="meta">${b.date?esc(fmtD(b.date,{weekday:"short",day:"numeric",month:"short"})):""} · ${esc(b.flour||"farine non notée")} · ${(+b.kg||0).toFixed(1).replace(".",",")} kg</div></div>
      <button class="react" data-del="bakes:${b.id}">Retirer</button></div>`).join("")
    :`<div class="empty">Le carnet est vierge. Note la première fournée : l'application calculera ton rythme et ton stock de farine.</div>`}</div></div>
  <div class="door"><div class="section-head"><h3>Les sacs de farine</h3>
    <div class="row" style="flex:none;gap:8px"><button class="btn ghost" style="flex:none" id="fl-photo">Photo</button>
    <button class="btn accent" style="flex:none" data-add="flour">Nouveau sac</button></div></div>
    <div class="items" style="margin-top:8px">${sacks.length?sacks.map(f=>`<div class="item"><div style="min-width:0"><b>${esc(f.name)}</b>
      <div class="meta">${(+f.kg||0).toFixed(1).replace(".",",")} kg · acheté ${since(f.bought)}${f.treated?" · passé au froid":" · à passer au froid"}</div></div>
      <button class="react" data-del="flours:${f.id}">Retirer</button></div>`).join("")
    :`<div class="empty">Aucun sac enregistré.</div>`}</div></div></div>`;
}

    const btn=bg.querySelector("#rv-go"); btn.disabled=true; btn.textContent="On range…";

/* --- Qu'as-tu consommé ? --- */
const MOTS_VIDES=new Set(["de","du","des","la","le","les","un","une","et","au","aux","en","gros","petit","petits","petite","petites","frais","fraiche","fraiches","bio","sachet","boite","boites","bocal","bocaux","piece","pieces","tranches","gousse","gousses","botte","brin","brins","cuillere","cuilleres","soupe","cafe","environ"]);
const motsUtiles = t => norm(t).replace(/[0-9]+([.,][0-9]+)?\s*(g|kg|ml|cl|l|mg)?/g," ").split(/[^a-z]+/).filter(m=>m.length>3&&!MOTS_VIDES.has(m));
function stockPourRecette(r){
  const ing=(r&&r.ingredients)||[], h=myHome();
  const lignes=ing.map(motsUtiles);
  return S.stock.filter(x=>x.home===h).filter(x=>{
    const mots=motsUtiles(x.name); if(!mots.length) return false;
    return lignes.some(l=>l.some(m=>mots.some(n=>m===n||m.startsWith(n)||n.startsWith(m))));
  }).map(x=>x.id);
}
function askConsumed(recette){
  const h=myHome();
  const items=S.stock.filter(s=>s.home===h);
  if(!items.length||!isUnlocked(h)) return;
  const vus=new Set(recette?stockPourRecette(recette):[]);
  const tri=[...items].sort((a,b)=>(vus.has(b.id)?1:0)-(vus.has(a.id)?1:0));
  const ligne=i=>`<div class="revh"><input type="checkbox" id="cs${i.id}" data-cs="${i.id}" ${vus.has(i.id)?"checked":""}>
    <div style="min-width:0;display:grid;gap:4px">
      <label for="cs${i.id}" style="font-weight:600">${esc(i.name)}${i.qty?` <span class="muted" style="font-weight:400">· ${esc(i.qty)}</span>`:""}</label>
      <div class="meta">${esc(PLACES[i.place])}${+i.price?" · "+eur(+i.price):""}</div>
      <input data-reste="${i.id}" placeholder="s'il en reste, note la quantité" style="font-size:13px">
    </div></div>`;
  const bg=sheet(`<h2>Qu'as-tu utilisé ?</h2>
  <p class="muted" style="margin:0">${recette?`D'après <b>${esc(recette.title||"la recette")}</b>, j'ai coché ce que tu avais en stock. Vérifie, puis je le retire du frigo et des armoires.`:"Coche ce qui a servi : le stock se met à jour et le boni grimpe."}</p>
  ${vus.size?`<p class="hint" style="margin:0">Si tu n'as pris qu'une partie, écris ce qu'il reste : l'article est gardé avec la nouvelle quantité.</p>`:""}
  <div style="display:grid;gap:2px;max-height:52vh;overflow:auto">${tri.slice(0,60).map(ligne).join("")}</div>
  <div class="row"><button class="btn ghost" data-close style="flex:none">Rien du stock</button>
    <button class="btn accent" style="flex:none" id="cs-go">Retirer du stock</button></div>`);
  bg.querySelector("#cs-go").onclick=async()=>{
    const btn=bg.querySelector("#cs-go"); btn.disabled=true; btn.textContent="On met à jour…";
    let sortis=0, gardes=0, gagne=0;
    for(const c of [...bg.querySelectorAll("[data-cs]")]){
      if(!c.checked) continue;
      const id=c.dataset.cs, i=S.stock.find(x=>x.id===id); if(!i) continue;
      const reste=(bg.querySelector(`[data-reste="${id}"]`)||{}).value.trim();
      try{
        if(reste){ await S.db.collection("stock").doc(id).update({qty:reste}); gardes++; }
        else { await consume(i); sortis++; gagne+=+i.price||0; }
      }catch{}
    }
    closeSheet();
    toast(sortis||gardes?`${sortis} sorti${sortis>1?"s":""} du stock${gardes?`, ${gardes} mis à jour`:""}${gagne?` · ${eur(gagne)} au boni`:""}`:"Rien de coché");
  };
}
async function consume(item){
  if(!item||!S.db) return;
  try{
    await S.db.collection("stock").doc(item.id).delete();
    const lim=item.place==="frais"?((item.days!=null&&item.days!=="")?Math.max(0,+item.days):(FRESH[item.cat]||4))-daysSince(item.since):item.place==="armoire"&&item.exp?daysTo(item.exp):0;
    if(item.home==="frejus") fqARacheter([item.name],true);
    if(+item.price) await S.db.collection("boni").add({home:item.home==="frejus"?(HOME_OF[S.me]||item.home):item.home,name:item.name,value:+item.price,sauve:lim>=0,at:Date.now(),by:S.me});
    noter("mange","");
    toast(+item.price?"Mangé — "+eur(+item.price)+" gagnés pour les vacances":"Mangé, sorti du stock");
  }catch{ toast("Pas enregistré, réessaie."); }
}

/* Calendrier lunaire du jardinier : longitude de la lune approchée (±0,5°), suffisante pour le signe et le jour. */
function moon(when){
  const d=(when.getTime()/864e5)+2440587.5-2451545.0, rad=Math.PI/180;
  const L=218.316+13.176396*d, Ma=134.963+13.064993*d;
  let lon=(L+6.289*Math.sin(Ma*rad))%360; if(lon<0) lon+=360;
  const syn=29.530588853, age=(((d+2451545.0-2451550.1)%syn)+syn)%syn;
  const SIGNS=["Bélier","Taureau","Gémeaux","Cancer","Lion","Vierge","Balance","Scorpion","Sagittaire","Capricorne","Verseau","Poissons"];
  const si=Math.floor(lon/30), el=["feu","terre","air","eau"][si%4];
  const JOUR={feu:["jour fruits et graines","tomates, courges, haricots, fruitiers : c'est le jour des fruits et des graines"],
    terre:["jour racines","carottes, panais, pommes de terre, radis : tout ce qui pousse sous terre"],
    air:["jour fleurs","fleurs, brocolis, choux-fleurs, artichauts"],
    eau:["jour feuilles","salades, épinards, choux, poireaux, herbes"]}[el];
  return {lon,sign:SIGNS[si],el,jour:JOUR[0],conseil:JOUR[1],age,
    croissante:age<syn/2, montante:(lon>=270||lon<90),
    phase:age<1.8?"nouvelle lune":age<7.4?"premier croissant":age<9.2?"premier quartier":age<14.8?"lune gibbeuse":age<16.6?"pleine lune":age<22.1?"gibbeuse décroissante":age<23.9?"dernier quartier":"dernier croissant"};
}

async function prepShot(file,max=1400,q=.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=url; });
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.naturalWidth*sc)||img.naturalWidth; cv.height=Math.round(img.naturalHeight*sc)||img.naturalHeight;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
    return blob||file;
  }catch{ return file; } finally{ try{URL.revokeObjectURL(url);}catch{} }
}
async function shotUrl(file,max=560,q=.78){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=url; });
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.naturalWidth*sc)||1; cv.height=Math.round(img.naturalHeight*sc)||1;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg",q);
  }catch{ return ""; } finally{ try{URL.revokeObjectURL(url);}catch{} }
}
async function askPhoto(file,prompt){
  if(!S.sample) throw {code:"no_sample"};
  let lim={}; try{ lim=await S.sample.limits(); }catch{}
  if(!lim.images) throw {code:"no_images"};
  const shot=await prepShot(file);
  return await S.sample.json(prompt,{images:[shot],modelTier:"complex"});
}

  : e&&e.code==="no_images" ? "La lecture de photo n'est pas disponible sur cet appareil."

  <div class="scan"><p class="muted" style="margin:0;max-width:40ch">Photographie la récolte posée sur la table : Claude reconnaît les légumes et propose un poids et un prix du magasin, que tu corriges.</p>
    <label class="btn accent" for="h-photo">Photo de la récolte</label>
    <input id="h-photo" type="file" accept="image/*" capture="environment">
    <span class="hint" id="h-st"></span></div>
  <form id="f" style="display:grid;gap:14px">
  <label>Ou à la main — quoi ?<input id="h-name" required placeholder="Ex. haricots verts"></label>
  <div class="row"><label>Poids (g)<input id="h-g" required inputmode="numeric" placeholder="Ex. 850"></label>
  <label>Prix du magasin (€/kg)<input id="h-p" inputmode="decimal" placeholder="Ex. 5,90"></label></div>
  <div class="row"><label>D'où ?<select id="h-where"><option value="partage">Potager partagé</option><option value="maison">Jardin de la maison</option></select></label>
  <label>Le<input type="date" id="h-date" value="${todayIso()}"></label></div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="h-stock" checked style="width:auto"> Ranger au frais, à utiliser en priorité</label>
  <div class="row"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn accent">Peser</button></div></form>`);
  bg.querySelector("#h-photo").onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    const st=bg.querySelector("#h-st"); st.textContent="Claude regarde la récolte…";
    try{
      const res=await askPhoto(f,`Voici la photo d'une récolte du potager, en Belgique, le ${fmtD(todayIso(),{day:"numeric",month:"long"})}. Liste uniquement les légumes et fruits que tu vois vraiment, sans rien inventer.
Pour chacun, estime le poids total visible en grammes, et donne le prix moyen au kilo en magasin en Belgique à cette saison.
Réponds uniquement avec ce JSON : {"items":[{"name":string (nom courant, ex. "haricots verts"),"g":number (poids estimé en grammes),"pricekg":number (prix moyen en euros par kilo)}]}`);
      const items=(res.items||[]).slice(0,15);
      if(!items.length){ st.textContent="Je n'ai reconnu aucun légume sur cette photo."; return; }
      reviewHarvest(items);
    }catch(err){ st.textContent=photoErr(err); }
  };
  bg.querySelector("#f").onsubmit=async e=>{ e.preventDefault(); const g=id=>bg.querySelector(id).value.trim();
    const grams=+g("#h-g")||0, pkg=+String(g("#h-p")).replace(",",".")||0, name=g("#h-name"), date=g("#h-date")||todayIso();
    const ok=await save("harvest",{home:myHome(),name,g:grams,pricekg:pkg,where:g("#h-where"),date,by:S.me,at:Date.now()});
    if(ok&&bg.querySelector("#h-stock").checked)
      await save("stock",{home:myHome(),place:"frais",name:name+" du potager",qty:grams+" g",cat:"legumes",since:date,
        price:Math.round(grams/1000*pkg*100)/100,garden:true,by:S.me,at:Date.now()});
    if(ok){ closeSheet(); toast(pkg?"Pesée notée — "+eur(grams/1000*pkg)+" au prix magasin":"Pesée notée"); } };
}
function reviewHarvest(items){
  const bg=sheet(`<h2>La récolte</h2>
  <p class="muted" style="margin:0">Les poids sont estimés d'après la photo : corrige-les si tu as pesé. Le prix du magasin sert au bilan du potager.</p>
  <div class="row"><label>D'où ?<select id="rh-where"><option value="partage">Potager partagé</option><option value="maison">Jardin de la maison</option></select></label>
    <label>Le<input type="date" id="rh-date" value="${todayIso()}"></label></div>
  <div style="display:grid;gap:4px">${items.map((i,n)=>`<div class="revh"><input type="checkbox" id="rh${n}" checked>
    <div style="min-width:0;display:grid;gap:6px">
      <input data-n="${n}" data-f="name" value="${esc(i.name)}" style="font-weight:600">
      <div class="row" style="gap:8px"><label style="flex:1;font-size:12px;color:var(--muted)">grammes
        <input data-n="${n}" data-f="g" inputmode="numeric" value="${esc(String(Math.round(+i.g||0)))}"></label>
      <label style="flex:1;font-size:12px;color:var(--muted)">€ / kg
        <input data-n="${n}" data-f="p" inputmode="decimal" value="${esc(String(i.pricekg||"").replace(".",","))}"></label></div>
    </div></div>`).join("")}</div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="rh-stock" checked style="width:auto"> Ranger au frais, à utiliser en priorité</label>
  <div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn accent" id="rh-go">Tout peser et ranger</button></div>`);
  bg.querySelector("#rh-go").onclick=async()=>{
    const btn=bg.querySelector("#rh-go"); btn.disabled=true; btn.textContent="On note…";
    const get=(n,f)=>bg.querySelector(`[data-n="${n}"][data-f="${f}"]`);
    const where=bg.querySelector("#rh-where").value, date=bg.querySelector("#rh-date").value||todayIso();
    const auFrais=bg.querySelector("#rh-stock").checked;
    let total=0, ok=0;
    for(let n=0;n<items.length;n++){
      if(!bg.querySelector("#rh"+n).checked) continue;
      const name=get(n,"name").value.trim()||items[n].name;
      const grams=+get(n,"g").value||0, pkg=+String(get(n,"p").value).replace(",",".")||0;
      if(await save("harvest",{home:myHome(),name,g:grams,pricekg:pkg,where,date,by:S.me,at:Date.now()})){
        ok++; total+=grams/1000*pkg;
        if(auFrais) await save("stock",{home:myHome(),place:"frais",name:name+" du potager",qty:grams+" g",cat:"legumes",
          since:date,price:Math.round(grams/1000*pkg*100)/100,garden:true,by:S.me,at:Date.now()});
      }
    }
    closeSheet(); toast(ok?ok+(ok>1?" légumes pesés — ":" légume pesé — ")+eur(total)+" au prix magasin":"Rien de coché");
  };
}

/* ---------- Loisirs : restaurants, hôtels et leur budget ---------- */
const LTABS=[["restos","🍽 Restaurants"],["hotels","🛏 Hôtels"],["budget","€ Le budget"]];
const OPTS_HOTEL=[["petitdej","Petit-déjeuner inclus"],["parking","Parking"],["borne","Borne de recharge"],["piscine","Piscine"],["animaux","Animaux acceptés"],["clim","Climatisation"]];
const montantTxt = v => nb(v)?eur(nb(v)):"";
/* Une sortie pendant un voyage du calendrier (ou un séjour à Fréjus) compte dans « Vacances ». */
function voyageDe(date){
  if(!date) return null;
  return S.events.filter(e=>(e.type==="voyage"||e.type==="frejus")&&date>=e.start&&date<=(e.end||e.start))
    .sort((a,b)=>((b.end||b.start)>(b.start)?1:0)-((a.end||a.start)>(a.start)?1:0))[0]||null;
}
const photoOk = u => /^(https:\/\/|data:image\/)/.test(u||"");
const lienAvisGoogle = (nom,lieu) => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([nom,lieu].filter(Boolean).join(", "));
const lienAvisTripadvisor = (nom,lieu) => "https://www.tripadvisor.fr/Search?q="+encodeURIComponent([nom,lieu].filter(Boolean).join(" "));
/* Laisser un avis : on copie l'impression, puis on ouvre la page où la poster (l'app ne peut pas publier à ta place). */
function laisserAvis(nom,lieu,texte,note){
  const t=String(texte||"").trim();
  const bg=sheet(`<h2>Laisser un avis</h2>
    <p class="muted" style="margin:0"><b>${esc(nom)}</b>${lieu?" · "+esc(lieu):""}</p>
    <label>Ton avis${note?` <span class="hint">${"★".repeat(note)}${"☆".repeat(5-note)}</span>`:""}<textarea id="la-t" style="min-height:110px">${esc(t)}</textarea></label>
    <p class="hint" style="margin:0">Le texte est copié, puis la page s'ouvre : sur Google, touche « Avis » puis « Écrire un avis », colle et envoie. Il faut être connecté à ton compte Google ou Tripadvisor.</p>
    <div class="row"><button class="btn accent" style="flex:none" data-la="g">Google</button>
      <button class="btn ghost" style="flex:none" data-la="t">Tripadvisor</button>
      <button class="btn ghost" data-close style="flex:none">Fermer</button></div>`);
  bg.querySelectorAll("[data-la]").forEach(b=>b.onclick=async()=>{
    const txt=bg.querySelector("#la-t").value.trim();
    try{ if(txt) await navigator.clipboard.writeText(txt); toast(txt?"Avis copié : colle-le dans la page":"Ouverture de la page"); }catch{ toast("Copie impossible ici : sélectionne le texte avant"); }
    window.open(b.dataset.la==="g"?lienAvisGoogle(nom,lieu):lienAvisTripadvisor(nom,lieu),"_blank");
  });
}
/* Les photos d'une sortie : jusqu'à 6, chacune marquée plat, ambiance ou chambre. */
function photosHtml(list,petit){
  const l=(list||[]).filter(p=>photoOk(p.url));
  if(!l.length) return "";
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">${l.map(p=>`<button type="button" class="ph-sortie" data-voirph="${esc(p.url)}|${esc(p.legende||p.quoi||"")}" style="padding:0;border:0;background:none;cursor:zoom-in;position:relative">
    <img src="${esc(p.url)}" alt="${esc(p.legende||p.quoi||"")}" loading="lazy" style="width:${petit?64:92}px;height:${petit?64:92}px;object-fit:cover;border-radius:12px;display:block">
    ${p.quoi?`<span style="position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(20,25,31,.7);color:#fff;border-radius:6px;padding:1px 6px">${esc(p.quoi)}</span>`:""}</button>`).join("")}</div>`;
}
function impressionsHtml(avis){
  const e=Object.entries(avis||{}).filter(([k,a])=>M[k]&&a&&(+a.stars||a.mot));
  if(!e.length) return "";
  return `<div style="display:grid;gap:6px">${e.map(([k,a])=>`<div style="display:flex;gap:8px;align-items:flex-start">${mag(k,"sm")}
    <div style="min-width:0">${+a.stars?`<span style="color:var(--accent);letter-spacing:1px;font-size:13px">${stars(+a.stars)}</span>`:""}${a.mot?`<div class="hand" style="font-size:18px">« ${esc(a.mot)} »</div>`:""}</div></div>`).join("")}</div>`;
}

  return `<div style="border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:12px">
    <b style="font-size:14px">On y est allés · ${v.length} fois</b>
    ${v.slice(0,3).map(s=>{ const vo=voyageDe(s.date), pp=nb(s.montant)&&+s.personnes?nb(s.montant)/+s.personnes:0;

        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b>${esc(fmtD(s.date,{weekday:"short",day:"numeric",month:"long",year:"numeric"}))}</b>${vo?` <span class="tag voyage">${esc(vo.title)}</span>`:""}</span>
          <span>${nb(s.montant)?`<b>${esc(eur(nb(s.montant)))}</b>`:""}${pp?` <span class="muted">· ${esc(eur(pp))} / pers.</span>`:""}</span></div>
        ${photosHtml(s.photos,true)}

          <button class="react" data-sortie-avis="${esc(s.id)}">Laisser un avis</button></div></div>`; }).join("")}</div>`;
}

    <textarea id="so-mot" maxlength="400" placeholder="Ex. accueil adorable, la côte à l'os était parfaite, un peu bruyant le samedi">${esc(mien.mot||"")}</textarea></div>

  bindPicker(bg,"so-qui");
  const q=id=>bg.querySelector(id);
  const peint=()=>bg.querySelectorAll("[data-sost]").forEach(b=>b.textContent=st>=+b.dataset.sost?"★":"☆");
  bg.querySelectorAll("[data-sost]").forEach(b=>b.onclick=()=>{ st=+b.dataset.sost; peint(); });
  const draw=()=>{ q("#so-phs").innerHTML=s.photos.map((p,n)=>`<span style="position:relative;display:inline-block;margin:0 8px 8px 0"><img src="${esc(p.url)}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:10px;display:block">

/* ---------- Les hôtels ---------- */
function etatHotel(h){ const a=todayIso(); if(!h.arrivee) return h.aTester?["atester","★ À tester"]:["a-dater","À dater"]; if(a<h.arrivee) return ["avenir","À venir"]; if(a<=(h.depart||h.arrivee)) return ["encours","En cours"]; return ["fini","Séjour fini"]; }
function nuits(h){ return h.arrivee&&h.depart?Math.max(1,Math.round((new Date(h.depart+"T12:00:00")-new Date(h.arrivee+"T12:00:00"))/864e5)):0; }
function hotelCard(h){
  const [k,lib]=etatHotel(h), n=nuits(h), vo=voyageDe(h.arrivee), prix=nb(h.prixFinal)||nb(h.prix);

  const opts=OPTS_HOTEL.filter(([o])=>(h.options||{})[o]);
  const site=urlSure(h.site), resa=urlSure(h.lienResa);
  const r={name:h.name,adresse:h.adresse,city:h.city};
  return `<article class="idea">${lpCouv(h,"hotels")}<div class="body" style="padding:16px;gap:12px">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div style="min-width:0"><h3>${esc(h.name)}</h3><div class="muted" style="font-size:14px">${esc(h.city||"")}${vo?" · "+esc(vo.title):""}</div></div>
      <span class="tag" style="flex:none;${k==="avenir"?"background:color-mix(in srgb,var(--accent) 24%,var(--door))":k==="encours"?"background:color-mix(in srgb,var(--ok) 24%,var(--door))":k==="atester"?"background:color-mix(in srgb,var(--m-loulou) 24%,var(--door))":""}">${esc(lib)}</span></div>
    <div class="fiche-resto">
      ${h.arrivee?`<div class="ligne">${IC.heure}<span>${esc(fmtD(h.arrivee,{weekday:"short",day:"numeric",month:"short"}))}${h.depart?" → "+esc(fmtD(h.depart,{weekday:"short",day:"numeric",month:"short"})):""}${n?" · "+n+" nuit"+(n>1?"s":""):""}${h.personnes?" · "+esc(h.personnes)+" pers.":""}</span></div>`:""}
      ${h.adresse||h.city?`<div class="ligne">${IC.pin}<a href="${esc(lienCarte(r))}" target="_blank" rel="noopener">${esc(h.adresse||h.city)}</a></div>`:""}

      ${!prix&&h.prixIndic?`<div class="ligne"><b style="width:16px;text-align:center;color:var(--muted)">€</b><span><b>${esc(h.prixIndic)}</b> <span class="muted">· prix indicatif</span></span></div>`:""}
      ${h.region?`<div class="ligne"><b style="width:16px;text-align:center;color:var(--muted)">↗</b><span>${esc(h.region)}</span></div>`:""}
      ${h.confirmation?`<div class="ligne"><b style="width:16px;text-align:center;color:var(--muted)">#</b><span>Réservation <b>${esc(h.confirmation)}</b></span></div>`:""}
    </div>
    ${opts.length?`<div class="pick" style="gap:6px">${opts.map(([,l])=>`<span class="tag">${esc(l)}</span>`).join("")}</div>`:""}
    ${ann&&k==="avenir"?`<div class="item ${annJ<=3?"warn":""}" style="border:0;padding:0"><div class="meta" style="${annJ<=3?"":"color:var(--ok);font-weight:600"}">${annJ<0?"Annulation gratuite terminée depuis le "+esc(fmtD(ann,{day:"numeric",month:"long"})):"Annulation gratuite jusqu'au "+esc(fmtD(ann,{weekday:"long",day:"numeric",month:"long"}))+(annJ<=3?" — plus que "+annJ+" jour"+(annJ>1?"s":""):"")}</div></div>`:""}
    <div class="actions-resto">${resa?`<a class="prim" href="${esc(resa)}" target="_blank" rel="noopener">Ma réservation</a>`:""}

async function prepPhoto(file,max=512,q=.85){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=url; });
    const side=Math.min(img.naturalWidth,img.naturalHeight);
    if(!side) throw new Error("vide");
    const cv=document.createElement("canvas"); cv.width=cv.height=Math.min(max,side);
    cv.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
    if(!blob) throw new Error("encode");
    const sm=document.createElement("canvas"); sm.width=sm.height=Math.min(256,cv.width);
    sm.getContext("2d").drawImage(cv,0,0,sm.width,sm.height);
    return {blob,dataUrl:sm.toDataURL("image/jpeg",.72)};
  } finally { URL.revokeObjectURL(url); }
}

const PLACE_ORDER=["surgelateur","armoire","frais"];
const shortD = d => d?fmtD(d,{day:"numeric",month:"short"}).replace(".",""):"";

function listData(opts){
  const h=myHome(), items=S.stock.filter(s=>s.home===h);
  const urgentFresh=new Set(freshList().filter(i=>i.left<=1).map(i=>i.id));
  const sections=[];
  let total=0, value=0;
  for(const place of PLACE_ORDER){
    if(!opts.places.includes(place)) continue;
    let its=items.filter(i=>i.place===place);
    if(place==="surgelateur"&&opts.urgent) its=[];
    if(place==="armoire"&&opts.urgent) its=its.filter(i=>i.exp&&daysTo(i.exp)<=60);
    if(place==="frais"&&opts.urgent) its=its.filter(i=>urgentFresh.has(i.id));
    if(!its.length) continue;
    const groups=[];
    if(place==="surgelateur"){
      for(let d=1;d<=DRAWERS;d++){
        const g=its.filter(i=>(+i.drawer||DRAWERS)===d); if(!g.length) continue;
        const c=CATS.find(x=>x.drawer===d);
        groups.push({title:"Tiroir "+d+" · "+(c?c.n:"Divers"),color:c?c.c:null,
          rows:g.map(i=>({name:i.name,qty:i.qty,right:"congelé "+shortD(i.since)}))});
      }
    } else if(place==="armoire"){
      const sp=its.filter(i=>i.cat==="epices"), jars=its.filter(i=>i.cat!=="epices")
        .sort((a,b)=>(a.exp||"9999-99").localeCompare(b.exp||"9999-99"));
      if(jars.length) groups.push({rows:jars.map(i=>{ const d=i.exp?daysTo(i.exp):null;
        return {name:i.name,qty:i.qty,urgent:d!==null&&d<=60,
          right:d===null?"sans date":d<0?"périmé":d===0?"aujourd'hui":"avant le "+shortD(i.exp)}; })});
      if(sp.length) groups.push({title:"Épices",rows:[{name:sp.map(i=>i.name).join(", "),wrap:true,right:""}]});
    } else {
      const fl=freshList().filter(i=>its.some(x=>x.id===i.id));
      groups.push({rows:fl.map(i=>({name:i.name,qty:i.qty,urgent:i.left<=1,
        right:i.left>1?"encore "+i.left+" jours":i.left===1?"demain":i.left===0?"aujourd'hui":"dépassé"}))});
    }
    total+=its.length; value+=its.reduce((s,x)=>s+(+x.price||0),0);
    sections.push({place,title:PLACES[place],n:its.length,groups});
  }
  const bits=sections.map(s=>s.n+" "+(s.place==="surgelateur"?"au surgélateur":s.place==="armoire"?"en armoires":"au frais"));
  return {homeName:HM[h].n, dateLong:fmtD(todayIso(),{weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    titre:opts.urgent?"À manger bientôt":"Notre stock", sections, total,
    summary:(total?total+(total>1?" articles":" article")+" · "+bits.join(", "):"Rien dans cette liste")+(value?" · "+eur(value)+" de valeur":"")};
}
function listText(d,wa){
  const B=s=>wa?"*"+s+"*":s.toUpperCase(), I=s=>wa?"_"+s+"_":s;
  const out=[B(d.titre)+(wa?" · ":" — ")+d.homeName, d.dateLong, ""];
  if(!d.sections.length) out.push("La liste est vide.");
  d.sections.forEach(s=>{
    out.push(B(s.title)+" ("+s.n+")");
    s.groups.forEach(g=>{
      if(g.title) out.push(I(g.title));
      g.rows.forEach(r=>out.push("• "+r.name+(r.qty?" · "+r.qty:"")+(r.right?" — "+r.right:"")+(r.urgent?" (à manger vite)":"")));
    });
    out.push("");
  });
  out.push(d.summary);
  let t=out.join("\n").trim();
  if(wa&&t.length>3200) t=t.slice(0,3100).replace(/\n[^\n]*$/,"")+"\n\n… la liste complète est dans l'application.";
  return t;
}

/* --- Un PDF écrit à la main : texte vectoriel, aucune bibliothèque --- */
const WIN={"€":128," ":160," ":160," ":160,"‑":45,"‚":130,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151};
function pdfStr(s){
  let o="";
  for(const ch of String(s)){
    let c=WIN[ch]!==undefined?WIN[ch]:ch.codePointAt(0);
    if(c>255){ const a=ch.normalize("NFD").replace(/[̀-ͯ]/g,""); c=(a&&a.codePointAt(0)<256)?a.codePointAt(0):63; }
    if(ch==="("||ch===")"||ch==="\\") o+="\\"+ch;
    else if(c<32||c>126) o+="\\"+c.toString(8).padStart(3,"0");
    else o+=String.fromCharCode(c);
  }
  return o;
}
let _mes;
function textW(s,size,bold){
  if(!_mes) _mes=document.createElement("canvas").getContext("2d");
  _mes.font=(bold?"bold ":"")+size+'px Helvetica, Arial, sans-serif';
  return _mes.measureText(String(s)).width;
}
function fit(s,size,bold,max){
  if(textW(s,size,bold)<=max) return s;
  let t=String(s);
  while(t.length>1&&textW(t+"…",size,bold)>max) t=t.slice(0,-1);
  return t+"…";
}

async function enDataUrl(src,max=480){
  if(/^data:image\//.test(src)&&src.length<120000) return src;
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin="anonymous"; i.onload=()=>res(i); i.onerror=rej; i.src=src; });
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*sc)||1; cv.height=Math.round(img.naturalHeight*sc)||1;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg",.75);
  }catch{ return ""; }
}

/* ---------- Les placards de Fréjus (préfixe fq) ---------- */ /* Le stock de la maison de Fréjus est dans la collection stock avec home:"frejus" (congélateur = surgelateur, armoires, frigo = frais) : les vues de Chez nous servent telles quelles, sans code de foyer (la maison est à toute la famille). Pendant un séjour (événement « frejus » du calendrier qui couvre aujourd'hui), l'app passe d'elle-même sur Fréjus : ce qu'on range, mange ou cuisine se déduit des placards de Fréjus ; l'argent (tickets, boni) reste celui du foyer. stock.verifie = date du dernier inventaire où l'article a été vu. meta "frejus-placards" : {inventaire, maison, depart (dates), par}. courses "frejus" : la liste « à racheter pour Fréjus ». fr_inventaire.vu / compte : dernier comptage de la vaisselle et des objets. */
const FQ="frejus";

const fqStock = () => S.stock.filter(s=>s.home===FQ);
const fqMeta = () => S.meta.find(x=>x.id==="frejus-placards")||{};
const fqArgent = () => myHome()===FQ?(HOME_OF[S.me]||HOMES[0].k):myHome();
function fqSejour(t){ t=t||todayIso(); const mien=(HM[HOME_OF[S.me]]||{members:[]}).members;
  return S.events.filter(e=>e.type==="frejus"&&e.start&&e.start<=t&&fjFin(e)>=t)
    .find(e=>{ const p=e.people||[]; return !p.length||p.includes(S.me)||p.some(k=>mien.includes(k)); })||null; }
const fqProchain = () => S.events.filter(e=>e.type==="frejus"&&e.start&&e.start>todayIso()).sort((a,b)=>a.start.localeCompare(b.start))[0]||null;

function fqAuto(){ if(S.home!=null||S.fqAutoVu||!S.events.length) return; S.fqAutoVu=true; if(fqSejour()){ S.home=FQ; S.fqAuto=true; } }

  if(await save("meta",m,"frejus-placards")){ const d=S.meta.find(x=>x.id==="frejus-placards"); if(d) Object.assign(d,m); else S.meta.push({id:"frejus-placards",...m}); } }

function fqAlerte(i){
  if(i.place==="armoire"){ const e=effExp(i); if(e&&daysTo(e)<0) return "périmé depuis le "+fmtD(e,{day:"numeric",month:"short",year:"numeric"}); }
  if(i.place==="frais"){ const lim=(i.days!=null&&i.days!=="")?Math.max(0,+i.days):(FRESH[i.cat]||4); if(daysSince(i.since)>lim) return "au frigo "+since(i.since).replace("il y a ","depuis "); }
  if(i.place==="surgelateur"&&daysSince(i.since)>300) return "congelé "+since(i.since);

# Compile l'app iPhone « Les Willys » sur un Mac de GitHub, à chaque envoi de code,
# puis prend des captures d'écran dans le simulateur (téléchargeables dans « Artifacts »).
name: App iPhone

on:
  push:
    paths: ["LesWillys/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write   # pour publier les captures sur la branche « captures-ios »

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: LesWillys
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Générer le projet (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild build \
            -project LesWillys.xcodeproj -scheme LesWillys \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Erreurs de compilation (résumé)
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Captures d'écran dans le simulateur
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/LesWillys.app
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEV" "$APP"
          mkdir -p captures
          # Premier lancement : on garde ce que l'app écrit, pour comprendre un éventuel plantage
          xcrun simctl launch --console-pty "$DEV" be.willys.app > captures/console.txt 2>&1 &
          sleep 12; kill %1 2>/dev/null || true
          xcrun simctl launch "$DEV" be.willys.app || true; sleep 6
          xcrun simctl io "$DEV" screenshot captures/0-qui-rentre.png
          for o in accueil calendrier voyages cuisine loisirs chez-nous; do
            xcrun simctl terminate "$DEV" be.willys.app || true
            xcrun simctl launch "$DEV" be.willys.app -demoMoi loulou -demoOnglet "$o"; sleep 6
            xcrun simctl io "$DEV" screenshot "captures/$o.png"
          done
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl terminate "$DEV" be.willys.app || true
          xcrun simctl launch "$DEV" be.willys.app -demoMoi loulou -demoOnglet accueil; sleep 6
          xcrun simctl io "$DEV" screenshot captures/accueil-sombre.png

      - name: Publier les captures sur la branche « captures-ios »
        run: |
          mkdir -p /tmp/cap && for f in captures/*.png; do sips -s format jpeg -s formatOptions 72 -Z 1400 "$f" --out "/tmp/cap/$(basename "${f%.png}").jpg" >/dev/null; done
          cp captures/console.txt /tmp/cap/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "LesWillys*" -newer build.log -exec cp {} /tmp/cap/ \; 2>/dev/null || true
          cd /tmp/cap
          echo "Captures de l'app iPhone — commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')" > LISEZMOI.txt
          git init -q -b captures-ios && git add . \
            && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Captures ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures-ios

      - name: Garder les captures et le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: les-willys-iphone
          path: |
            LesWillys/captures
            LesWillys/build.log
          retention-days: 14
